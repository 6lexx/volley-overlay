<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Overlay · Commentaire volley</title>
<link rel="stylesheet" href="shared/fonts.css">
<style>
  :root {
    --nuit: rgba(22,19,15,.94);
    --nuit-2: #2B251F;
    --texte: #F5EFE6;
    --doux: #C9C0B3;
    --braise: #F08A24;
    --encre: #16130F;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
    --corps: "Barlow", system-ui, sans-serif;
    --biais: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: var(--corps); color: var(--texte); -webkit-font-smoothing: antialiased; }
  body.apercu { background: linear-gradient(180deg, #24232a 0%, #34312e 40%, #7a4d2b 40.2%, #9c653a 72%, #6d4426 100%); }
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }

  /* Apparitions courtes et sèches (250 ms), sans clignotement */
  .bloc { transition: opacity .25s ease-out, transform .25s ease-out; }
  .bloc.cache { opacity: 0; pointer-events: none; }
  .gauche.cache { transform: translateX(-36px); }
  .bas.cache { transform: translate(-50%, 28px); }

  /* Formes en biseau */
  .bz { clip-path: polygon(var(--biais) 0, 100% 0, calc(100% - var(--biais)) 100%, 0 100%); }
  .bz-d { clip-path: polygon(0 0, 100% 0, calc(100% - var(--biais)) 100%, 0 100%); }

  /* ---------- Plaque de score (haut gauche) ---------- */
  #score { position: absolute; left: 48px; top: 40px; display: flex; flex-direction: column; gap: 4px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.4)); }
  #score .onglets { display: flex; }
  #score .ong { font-family: var(--cond); font-weight: 700; font-size: 24px; letter-spacing: 1.5px; text-transform: uppercase; padding: 6px 30px 6px 18px; --biais: 14px; white-space: nowrap; }
  #score .ong.compet { background: var(--braise); color: var(--encre); max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
  #score .ong.set { background: var(--encre); color: var(--texte); margin-left: -10px; padding-left: 26px; }
  #score .ligne { display: flex; height: 70px; }
  #score .nom { width: 176px; display: flex; align-items: center; padding-left: 20px; font-family: var(--cond); font-weight: 800; font-size: 48px; letter-spacing: 1px; line-height: 1; }
  #score .case { margin-left: -14px; display: flex; align-items: center; justify-content: center; font-family: var(--cond); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #score .serv { width: 72px; background: var(--nuit); }
  #score .serv img { width: 40px; height: 40px; display: block; transition: opacity .2s; }
  #score .serv img.non { opacity: 0; }
  #score .sets { width: 72px; background: var(--nuit-2); color: var(--braise); font-size: 46px; }
  #score .pts { width: 128px; padding-right: 8px; background: var(--nuit); font-size: 66px; color: var(--doux); }
  #score .ligne.mene .pts { color: var(--texte); }
  #score .histo { display: flex; }
  #score .histo div { background: rgba(22,19,15,.88); font-family: var(--cond); font-weight: 600; font-size: 24px; padding: 4px 22px 4px 18px; --biais: 10px; font-variant-numeric: tabular-nums; }
  #score .histo div + div { margin-left: -4px; padding-left: 22px; }
  #cote { position: absolute; left: 48px; top: 296px; background: var(--braise); color: var(--encre); font-family: var(--cond); font-weight: 800; font-size: 30px; letter-spacing: 2px; padding: 8px 34px 8px 20px; --biais: 14px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.4)); }

  /* ---------- Carte joueur (bas gauche) ---------- */
  #carte { position: absolute; left: 48px; bottom: 64px; display: flex; flex-direction: column; filter: drop-shadow(0 8px 22px rgba(0,0,0,.45)); }
  #carte .tete { align-self: flex-start; font-family: var(--cond); font-weight: 700; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; padding: 6px 34px 6px 20px; --biais: 14px; }
  #carte .corps { display: flex; height: 168px; }
  #carte .numero { width: 176px; display: flex; align-items: center; justify-content: center; font-family: var(--cond); font-weight: 800; font-size: 120px; line-height: 1; padding-right: 10px; }
  #carte .infos { margin-left: -14px; min-width: 520px; max-width: 900px; background: var(--nuit); padding: 18px 64px 18px 40px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  #carte .prenom { font-family: var(--cond); font-weight: 700; font-size: 40px; line-height: 1; }
  #carte .nomj { font-family: var(--cond); font-weight: 800; font-size: 60px; line-height: .95; letter-spacing: 1px; white-space: nowrap; overflow: hidden; }
  #carte .detail { display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 600; color: var(--doux); margin-top: 2px; }
  #carte .detail .poste { color: var(--braise); font-family: var(--cond); font-weight: 700; font-size: 28px; letter-spacing: 1px; text-transform: uppercase; }
  #carte .badge { font-family: var(--cond); font-weight: 800; font-size: 24px; background: var(--texte); color: var(--encre); padding: 0 10px; line-height: 32px; }
  #carte .floc { font-family: var(--cond); font-weight: 600; font-size: 26px; color: var(--doux); }
  #carte .floc b { color: var(--texte); font-weight: 700; letter-spacing: 1px; }
  #carte .progres { height: 4px; background: rgba(22,19,15,.6); }
  #carte .progres div { height: 4px; background: var(--braise); width: 0; }

  /* ---------- Récap des sets (bas centre) ---------- */
  #recap { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 4px; filter: drop-shadow(0 8px 22px rgba(0,0,0,.45)); }
  #recap .tete { align-self: flex-start; background: var(--braise); color: var(--encre); font-family: var(--cond); font-weight: 800; font-size: 28px; letter-spacing: 2px; padding: 6px 36px 6px 22px; --biais: 14px; text-transform: uppercase; }
  #recap .ligne { display: flex; height: 76px; }
  #recap .nom { width: 360px; display: flex; align-items: center; padding: 0 34px 0 22px; font-family: var(--cond); font-weight: 800; line-height: 1; }
  #recap .nom span { display: block; width: 100%; font-size: 44px; white-space: nowrap; overflow: hidden; }
  #recap .c { margin-left: -14px; width: 92px; display: flex; align-items: center; justify-content: center; background: var(--nuit); font-family: var(--cond); font-weight: 700; font-size: 44px; color: #8F867A; font-variant-numeric: tabular-nums; }
  #recap .c.g { color: var(--texte); }
  #recap .c.tot { width: 104px; background: var(--nuit-2); color: var(--braise); font-weight: 800; font-size: 52px; }

  /* ---------- Victoire (bas centre) ---------- */
  #victoire { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); display: flex; flex-direction: column; filter: drop-shadow(0 10px 26px rgba(0,0,0,.5)); }
  #victoire .tete { align-self: flex-start; background: var(--braise); color: var(--encre); font-family: var(--cond); font-weight: 800; font-size: 34px; letter-spacing: 4px; padding: 6px 40px 6px 24px; --biais: 16px; }
  #victoire .corps { display: flex; height: 150px; --biais: 26px; }
  #victoire .gagnant { display: flex; flex-direction: column; justify-content: center; padding: 0 70px 0 36px; min-width: 640px; max-width: 1180px; }
  #victoire .gagnant .n { font-family: var(--cond); font-weight: 800; font-size: 96px; line-height: .95; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  #victoire .gagnant .f { font-size: 26px; font-weight: 600; opacity: .92; }
  #victoire .sc { margin-left: -20px; background: var(--nuit); display: flex; align-items: center; gap: 18px; padding: 0 64px 0 56px; font-family: var(--cond); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  #victoire .sc .g { font-size: 110px; color: var(--texte); }
  #victoire .sc .t { font-size: 60px; color: #8F867A; }
  #victoire .sc .l { font-size: 110px; color: #8F867A; }
  #victoire .detail { align-self: flex-start; margin-top: 4px; background: rgba(22,19,15,.9); font-family: var(--cond); font-weight: 600; font-size: 26px; padding: 6px 36px 6px 22px; --biais: 12px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }

  /* ---------- Affiche (plein écran, caméra assombrie) ---------- */
  #affiche { position: absolute; inset: 0; }
  #affiche .voile { position: absolute; inset: 0; background: rgba(10,8,6,.62); }
  #affiche .compet { position: absolute; left: 0; right: 0; top: 250px; display: flex; justify-content: center; }
  #affiche .compet div { background: var(--braise); color: var(--encre); font-family: var(--cond); font-weight: 700; font-size: 32px; letter-spacing: 3px; padding: 8px 44px; --biais: 14px; text-transform: uppercase; }
  #affiche .face { position: absolute; left: 0; right: 0; top: 330px; height: 360px; display: flex; }
  #affiche .moitie { flex: 1 1 0; display: flex; align-items: center; gap: 44px; }
  #affiche .moitie.a { clip-path: polygon(0 0, 100% 0, calc(100% - 90px) 100%, 0 100%); justify-content: flex-end; padding-right: 190px; }
  #affiche .moitie.b { margin-left: -90px; clip-path: polygon(90px 0, 100% 0, 100% 100%, 0 100%); justify-content: flex-start; padding-left: 190px; }
  #affiche .txt { display: flex; flex-direction: column; gap: 8px; max-width: 520px; }
  #affiche .a .txt { align-items: flex-end; text-align: right; }
  #affiche .txt .n { font-family: var(--cond); font-weight: 800; font-size: 92px; line-height: .95; letter-spacing: 1px; text-transform: uppercase; }
  #affiche .txt .s { font-size: 28px; font-weight: 600; opacity: .92; }
  #affiche .logo { width: 196px; height: 196px; flex: 0 0 auto; border-radius: 50%; background: var(--texte); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(255,255,255,.18); overflow: hidden; font-family: var(--cond); font-weight: 800; font-size: 64px; }
  #affiche .logo img { width: 80%; height: 80%; object-fit: contain; }
  #affiche .vs { position: absolute; left: 0; right: 0; top: 454px; display: flex; justify-content: center; }
  #affiche .vs div { width: 112px; height: 112px; background: var(--encre); transform: rotate(45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 6px var(--braise); }
  #affiche .vs span { transform: rotate(-45deg); font-family: var(--cond); font-weight: 800; font-size: 50px; color: var(--braise); }
  #affiche .infos { position: absolute; left: 0; right: 0; top: 730px; display: flex; justify-content: center; }
  #affiche .infos div { background: rgba(22,19,15,.95); display: flex; align-items: center; gap: 28px; padding: 14px 40px; font-family: var(--cond); font-weight: 600; font-size: 34px; letter-spacing: 1px; }
  #affiche .infos i { width: 9px; height: 9px; background: var(--braise); transform: rotate(45deg); }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div id="affiche" class="bloc cache" aria-hidden="true"></div>

  <div id="score" class="bloc gauche cache">
    <div class="onglets"><div class="ong compet bz-d" id="sCompet"></div><div class="ong set bz" id="sSet"></div></div>
    <div class="ligne" id="lA"><div class="nom bz-d" id="nA"></div><div class="case serv bz"><img id="bA" src="assets/ballon.png" alt=""></div><div class="case sets bz" id="stA">0</div><div class="case pts bz" id="pA">0</div></div>
    <div class="ligne" id="lB"><div class="nom bz-d" id="nB"></div><div class="case serv bz"><img id="bB" src="assets/ballon.png" alt=""></div><div class="case sets bz" id="stB">0</div><div class="case pts bz" id="pB">0</div></div>
    <div class="histo" id="histo"></div>
  </div>
  <div id="cote" class="bloc gauche cache bz-d">CHANGEMENT DE CÔTÉ</div>

  <div id="carte" class="bloc gauche cache"></div>
  <div id="recap" class="bloc bas cache"></div>
  <div id="victoire" class="bloc bas cache"></div>
</div>

<script src="config.js"></script>
<script type="module">
import { CFG, $, param, esc, monterScene, surSignalRecharge } from "./shared/outils.js";
import { connecter } from "./shared/firebase.js";
import { calculer } from "./shared/moteur.js";
import { dateLongue, heureCourte } from "./shared/donnees.js";

monterScene($("#scene"));
if (param("apercu") === "1") document.body.classList.add("apercu");

const api = await connecter();
let live = {};
api.ecouter("live", (v) => { live = v || {}; surSignalRecharge(live.recharger); rendre(); });

const montrer = (el, oui) => el.classList.toggle("cache", !oui);
const couleurs = (el, eq) => { el.style.background = eq.couleur; el.style.color = eq.texte; };
let cleAffiche = "", cleRecap = "", cleVictoire = "", cleCarte = "";

function rendre() {
  const m = live.match;
  if (!m) { document.querySelectorAll(".bloc").forEach((b) => montrer(b, false)); return; }
  const now = api.maintenant();
  const etat = calculer(m.format, live.points || "", live.corrections || {});
  const h = live.habillage || null;
  const visible = !live.masque;
  const type = h?.type || null;
  const expire = h?.duree && now - (h.ts || 0) > h.duree;
  const hType = expire ? null : type;

  // --- Plaque de score ---
  $("#sCompet").textContent = m.competition || "";
  $("#sCompet").hidden = !m.competition;
  $("#sSet").textContent = etat.fini ? "FIN DU MATCH" : etat.courant.tieBreak ? "TIE-BREAK" : `SET ${etat.courant.num}`;
  for (const c of ["A", "B"]) {
    const eq = m[c];
    const n = $("#n" + c);
    n.textContent = eq.court; couleurs(n, eq);
    $("#st" + c).textContent = etat.gagnes[c];
    const pts = etat.fini ? (etat.sets.at(-1)?.[c] ?? 0) : etat.courant[c];
    $("#p" + c).textContent = pts;
    $("#b" + c).classList.toggle("non", etat.service !== c);
  }
  const ptsA = etat.fini ? 0 : etat.courant.A, ptsB = etat.fini ? 0 : etat.courant.B;
  $("#lA").classList.toggle("mene", etat.fini ? etat.gagnant === "A" : ptsA >= ptsB);
  $("#lB").classList.toggle("mene", etat.fini ? etat.gagnant === "B" : ptsB >= ptsA);
  const histo = etat.sets.map((s, i) => `<div class="${i ? "bz" : "bz-d"}">S${i + 1} · ${s.A}-${s.B}</div>`).join("");
  if ($("#histo").innerHTML !== histo) $("#histo").innerHTML = histo;
  montrer($("#score"), visible && hType !== "affiche");

  // --- Changement de côté au tie-break ---
  const coteActif = etat.dernierChangeCote && now - (live.dernierPoint || 0) < CFG.affichage.coteSec * 1000;
  montrer($("#cote"), visible && coteActif && hType !== "affiche");

  // --- Affiche ---
  if (hType === "affiche") {
    const cle = JSON.stringify([m.A, m.B, m.competition, m.date, m.heure, m.salle]);
    if (cle !== cleAffiche) { cleAffiche = cle; $("#affiche").innerHTML = htmlAffiche(m); ajuster("#affiche .txt .n", 44, 270); }
  }
  montrer($("#affiche"), visible && hType === "affiche");

  // --- Cartes joueurs ---
  let carteVisible = false;
  if (hType === "joueurs") {
    const eq = m[h.eq || m.suivi || "A"];
    const js = eq?.joueurs || [];
    if (js.length) {
      const dur = CFG.affichage.carteJoueurSec * 1000;
      const ecoule = Math.max(0, now - (h.ts || now));
      const i = Math.floor(ecoule / dur) % js.length;
      const cle = (h.eq || "") + "|" + i + "|" + JSON.stringify(js[i]) + eq.couleur;
      if (cle !== cleCarte) { cleCarte = cle; $("#carte").innerHTML = htmlCarte(eq, js[i]); ajuster("#carte .nomj", 36); }
      const prog = $("#carte .progres div");
      if (prog) prog.style.width = ((ecoule % dur) / dur) * 100 + "%";
      carteVisible = true;
    }
  }
  montrer($("#carte"), visible && carteVisible);

  // --- Récap des sets ---
  if (hType === "recap") {
    const cle = JSON.stringify([etat.sets, etat.gagnes, m.A.court, m.B.court, h.titre]);
    if (cle !== cleRecap) { cleRecap = cle; $("#recap").innerHTML = htmlRecap(m, etat, h); ajuster("#recap .nom span", 24); }
  }
  montrer($("#recap"), visible && hType === "recap" && etat.sets.length > 0);

  // --- Victoire ---
  if (hType === "victoire" && etat.fini) {
    const cle = JSON.stringify([etat.sets, etat.gagnant, m.A.nom, m.B.nom]);
    if (cle !== cleVictoire) { cleVictoire = cle; $("#victoire").innerHTML = htmlVictoire(m, etat); ajuster("#victoire .gagnant .n", 48); }
  }
  montrer($("#victoire"), visible && hType === "victoire" && etat.fini);
}
setInterval(rendre, 200);

// Réduit la police d'un texte trop long pour sa case (noms de clubs à rallonge)
function ajuster(sel, min, hauteurMax) {
  document.querySelectorAll(sel).forEach((el) => {
    let t = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = "";
    t = parseFloat(getComputedStyle(el).fontSize);
    const trop = () => el.scrollWidth > el.clientWidth + 1 || (hauteurMax && el.scrollHeight > hauteurMax);
    while (trop() && t > min) { t -= 2; el.style.fontSize = t + "px"; }
  });
}

function htmlAffiche(m) {
  const cote = (c) => {
    const eq = m[c];
    const logo = `<div class="logo" style="color:${esc(eq.couleur)}">${eq.logo ? `<img src="${esc(eq.logo)}" alt="">` : esc(eq.court)}</div>`;
    const txt = `<div class="txt"><div class="n">${esc(eq.nom)}</div>${eq.sousTitre ? `<div class="s">${esc(eq.sousTitre)}</div>` : ""}</div>`;
    return `<div class="moitie ${c.toLowerCase()}" style="background:${esc(eq.couleur)};color:${esc(eq.texte)}">${c === "A" ? txt + logo : logo + txt}</div>`;
  };
  const infos = [[dateLongue(m.date), heureCourte(m.heure)].filter(Boolean).join(" · "), m.salle].filter(Boolean);
  return `<div class="voile"></div>
    ${m.competition ? `<div class="compet"><div class="bz">${esc(m.competition)}</div></div>` : ""}
    <div class="face">${cote("A")}${cote("B")}</div>
    <div class="vs"><div><span>VS</span></div></div>
    ${infos.length ? `<div class="infos"><div>${infos.map((x) => `<span>${esc(x)}</span>`).join("<i></i>")}</div></div>` : ""}`;
}

function htmlCarte(eq, j) {
  const badges = (j.capitaine ? `<span class="badge">C</span>` : "") + (j.libero && j.poste !== "Libéro" ? `<span class="badge">L</span>` : "");
  return `<div class="tete bz-d" style="background:${esc(eq.couleur)};color:${esc(eq.texte)}">${esc(eq.nom)}${eq.sousTitre ? " · " + esc(eq.sousTitre) : ""}</div>
    <div class="corps">
      <div class="numero bz-d" style="background:${esc(eq.couleur)};color:${esc(eq.texte)};--biais:22px">${esc(j.num)}</div>
      <div class="infos bz" style="--biais:22px">
        ${j.prenom ? `<div class="prenom">${esc(j.prenom)}</div>` : ""}
        <div class="nomj">${esc(j.nom || j.prenom)}</div>
        <div class="detail">${j.poste ? `<span class="poste">${esc(j.poste)}</span>` : ""}${badges}${j.flocage ? `<span class="floc">Flocage <b>${esc(j.flocage)}</b></span>` : ""}</div>
      </div>
    </div>
    <div class="progres"><div></div></div>`;
}

function htmlRecap(m, etat, h) {
  const titre = h.titre || (etat.fini ? "Score final" : `Fin du set ${etat.sets.length}`);
  const ligne = (c) => `<div class="ligne">
      <div class="nom bz-d" style="background:${esc(m[c].couleur)};color:${esc(m[c].texte)}"><span>${esc(m[c].nom)}</span></div>
      ${etat.sets.map((s) => `<div class="c bz${s.gagnant === c ? " g" : ""}">${s[c]}</div>`).join("")}
      <div class="c tot bz">${etat.gagnes[c]}</div></div>`;
  return `<div class="tete bz-d">${esc(titre)}</div>${ligne("A")}${ligne("B")}`;
}

function htmlVictoire(m, etat) {
  const g = etat.gagnant, p = g === "A" ? "B" : "A";
  return `<div class="tete bz-d">VICTOIRE</div>
    <div class="corps">
      <div class="gagnant bz-d" style="background:${esc(m[g].couleur)};color:${esc(m[g].texte)};--biais:26px"><div class="n">${esc(m[g].nom)}</div><div class="f">face à ${esc(m[p].nom)}</div></div>
      <div class="sc bz" style="--biais:26px"><span class="g">${etat.gagnes[g]}</span><span class="t">–</span><span class="l">${etat.gagnes[p]}</span></div>
    </div>
    <div class="detail bz-d">${etat.sets.map((s) => `${s.A}-${s.B}`).join("   ·   ")}</div>`;
}
</script>
</body>
</html>
