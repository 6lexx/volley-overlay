<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Overlay · Commentaire volley</title>
<link rel="stylesheet" href="shared/fonts.css">
<style>
  :root {
    --nuit: rgba(22,19,15,.94);
    --nuit-2: #2B251F;
    --texte: #F5EFE6;
    --doux: #C9C0B3;
    --braise: #F08A24;
    --encre: #16130F;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
    --corps: "Barlow", system-ui, sans-serif;
    --biais: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: var(--corps); color: var(--texte); -webkit-font-smoothing: antialiased; }
  body.apercu { background: linear-gradient(180deg, #24232a 0%, #34312e 40%, #7a4d2b 40.2%, #9c653a 72%, #6d4426 100%); }
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }

  /* Apparitions courtes et sèches (250 ms), sans clignotement */
  .bloc { transition: opacity .25s ease-out, transform .25s ease-out; }
  .bloc.cache { opacity: 0; pointer-events: none; }
  .gauche.cache { transform: translateX(-36px); }
  .bas.cache { transform: translate(-50%, 28px); }

  /* Formes en biseau */
  .bz { clip-path: polygon(var(--biais) 0, 100% 0, calc(100% - var(--biais)) 100%, 0 100%); }
  .bz-d { clip-path: polygon(0 0, 100% 0, calc(100% - var(--biais)) 100%, 0 100%); }

  /* ---------- Plaque de score (haut gauche) ---------- */
  #zoneScore { position: absolute; left: 48px; top: 40px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  #score { display: flex; flex-direction: column; gap: 4px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.4)); }
  #score .onglets { display: flex; }
  #score .ong { font-family: var(--cond); font-weight: 700; font-size: 24px; letter-spacing: 1.5px; text-transform: uppercase; padding: 6px 30px 6px 18px; --biais: 14px; white-space: nowrap; }
  #score .ong.compet { background: var(--braise); color: var(--encre); max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
  #score .ong.set { background: var(--encre); color: var(--texte); margin-left: -10px; padding-left: 26px; }
  #score .ligne { display: flex; height: 70px; }
  #score .nom { width: 176px; display: flex; align-items: center; padding-left: 20px; font-family: var(--cond); font-weight: 800; font-size: 48px; letter-spacing: 1px; line-height: 1; }
  #score .case { margin-left: -14px; display: flex; align-items: center; justify-content: center; font-family: var(--cond); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #score .serv { width: 72px; background: var(--nuit); }
  #score .serv img { width: 40px; height: 40px; display: block; transition: opacity .2s; }
  #score .serv img.non { opacity: 0; }
  #score .sets { width: 72px; background: var(--nuit-2); color: var(--braise); font-size: 46px; }
  #score .pts { width: 128px; padding-right: 8px; background: var(--nuit); font-size: 66px; color: var(--doux); }
  #score .ligne.mene .pts { color: var(--texte); }
  #score .histo { display: flex; }
  #score .histo div { background: rgba(22,19,15,.88); font-family: var(--cond); font-weight: 600; font-size: 24px; padding: 4px 22px 4px 18px; --biais: 10px; font-variant-numeric: tabular-nums; }
  #score .histo div + div { margin-left: -4px; padding-left: 22px; }
  /* Bandeaux sous le score : ils s'empilent */
  .bandeau { display: flex; filter: drop-shadow(0 6px 18px rgba(0,0,0,.4)); animation: entree .25s ease-out; }
  .bandeau[hidden] { display: none; }
  @keyframes entree { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
  .bandeau .a { font-family: var(--cond); font-weight: 800; font-size: 30px; letter-spacing: 2px; padding: 8px 34px 8px 20px; --biais: 14px; text-transform: uppercase; white-space: nowrap; }
  .bandeau .b { margin-left: -10px; background: var(--nuit); font-family: var(--cond); font-weight: 700; font-size: 30px; letter-spacing: 1px; padding: 8px 34px 8px 28px; --biais: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bandeau .b em { font-style: normal; color: var(--braise); font-weight: 800; }
  .braise { background: var(--braise); color: var(--encre); }

  /* ---------- Club à l'honneur (bas gauche) ---------- */
  #honneur { position: absolute; left: 48px; bottom: 64px; display: flex; flex-direction: column; filter: drop-shadow(0 8px 22px rgba(0,0,0,.45)); max-width: 1320px; }
  #honneur .tete { align-self: flex-start; font-family: var(--cond); font-weight: 800; font-size: 26px; letter-spacing: 3px; padding: 6px 36px 6px 20px; --biais: 14px; }
  #honneur .corps { display: flex; min-height: 190px; }
  #honneur .club { flex: 0 0 auto; display: flex; align-items: center; gap: 22px; padding: 20px 56px 20px 24px; --biais: 26px; }
  #honneur .logo { width: 120px; height: 120px; border-radius: 50%; background: var(--texte); display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: var(--cond); font-weight: 800; font-size: 44px; }
  #honneur .logo img { width: 80%; height: 80%; object-fit: contain; }
  #honneur .nom { font-family: var(--cond); font-weight: 800; font-size: 64px; line-height: 1.05; text-transform: uppercase; max-width: 460px; }
  #honneur .infos { margin-left: -20px; background: var(--nuit); padding: 18px 64px 18px 48px; display: flex; flex-direction: column; justify-content: center; gap: 8px; --biais: 26px; min-width: 0; }
  #honneur .pres { font-size: 28px; font-weight: 600; line-height: 1.3; max-width: 640px; }
  #honneur .ligne { font-size: 24px; font-weight: 600; color: var(--doux); line-height: 1.3; }
  #honneur .ligne b { font-family: var(--cond); font-weight: 700; font-size: 24px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--braise); margin-right: 8px; }
  #honneur .reseaux { font-family: var(--cond); font-weight: 700; font-size: 30px; color: var(--texte); letter-spacing: .5px; }

  /* ---------- Effectif (plein écran, caméra assombrie) ---------- */
  #effectif { position: absolute; inset: 0; }
  #effectif .voile { position: absolute; inset: 0; background: rgba(10,8,6,.66); }
  #effectif .cadre { position: absolute; left: 120px; right: 120px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 22px; }
  #effectif .tete { align-self: flex-start; display: flex; align-items: stretch; filter: drop-shadow(0 8px 22px rgba(0,0,0,.45)); }
  #effectif .tete .n { font-family: var(--cond); font-weight: 800; font-size: 64px; line-height: 1.1; letter-spacing: 1px; text-transform: uppercase; padding: 8px 56px 8px 28px; --biais: 22px; }
  #effectif .tete .s { margin-left: -16px; display: flex; align-items: center; background: var(--braise); color: var(--encre); font-family: var(--cond); font-weight: 700; font-size: 30px; letter-spacing: 2px; text-transform: uppercase; padding: 0 40px 0 36px; --biais: 22px; }
  #effectif .grille { display: grid; gap: 14px 18px; }
  #effectif .j { display: flex; height: 126px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.4)); min-width: 0; }
  #effectif .num { flex: 0 0 100px; display: flex; align-items: center; justify-content: center; font-family: var(--cond); font-weight: 800; font-size: 58px; line-height: 1; padding-right: 8px; --biais: 16px; }
  #effectif .infos { flex: 1 1 auto; min-width: 0; margin-left: -12px; background: var(--nuit); padding: 8px 30px 8px 28px; display: flex; flex-direction: column; justify-content: center; gap: 1px; --biais: 16px; }
  #effectif .prenom { font-family: var(--cond); font-weight: 700; font-size: 25px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #effectif .nomj { font-family: var(--cond); font-weight: 800; font-size: 38px; line-height: 1.15; letter-spacing: .5px; white-space: nowrap; }
  #effectif .detail { display: flex; align-items: center; gap: 10px; min-width: 0; white-space: nowrap; line-height: 1.2; }
  #effectif .poste { color: var(--braise); font-family: var(--cond); font-weight: 700; font-size: 22px; letter-spacing: 1px; text-transform: uppercase; }
  #effectif .badge { font-family: var(--cond); font-weight: 800; font-size: 19px; background: var(--texte); color: var(--encre); padding: 0 7px; line-height: 24px; }
  #effectif .floc { font-family: var(--cond); font-weight: 600; font-size: 21px; color: var(--doux); overflow: hidden; text-overflow: ellipsis; }
  #effectif .floc b { color: var(--texte); font-weight: 700; letter-spacing: .5px; }

  /* ---------- Récap des sets (bas centre) ---------- */
  #recap { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 4px; filter: drop-shadow(0 8px 22px rgba(0,0,0,.45)); }
  #recap .tete { align-self: flex-start; background: var(--braise); color: var(--encre); font-family: var(--cond); font-weight: 800; font-size: 28px; letter-spacing: 2px; padding: 6px 36px 6px 22px; --biais: 14px; text-transform: uppercase; }
  #recap .ligne { display: flex; height: 76px; }
  #recap .nom { width: 360px; display: flex; align-items: center; padding: 0 34px 0 22px; font-family: var(--cond); font-weight: 800; line-height: 1; }
  #recap .nom span { display: block; width: 100%; font-size: 44px; line-height: 1.15; white-space: nowrap; overflow: hidden; }
  #recap .c { margin-left: -14px; width: 92px; display: flex; align-items: center; justify-content: center; background: var(--nuit); font-family: var(--cond); font-weight: 700; font-size: 44px; color: #8F867A; font-variant-numeric: tabular-nums; }
  #recap .c.g { color: var(--texte); }
  #recap .c.tot { width: 104px; background: var(--nuit-2); color: var(--braise); font-weight: 800; font-size: 52px; }

  /* ---------- Victoire (bas centre) ---------- */
  #victoire { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); display: flex; flex-direction: column; filter: drop-shadow(0 10px 26px rgba(0,0,0,.5)); }
  #victoire .tete { align-self: flex-start; background: var(--braise); color: var(--encre); font-family: var(--cond); font-weight: 800; font-size: 34px; letter-spacing: 4px; padding: 6px 40px 6px 24px; --biais: 16px; }
  #victoire .corps { display: flex; height: 150px; --biais: 26px; }
  #victoire .gagnant { display: flex; flex-direction: column; justify-content: center; padding: 0 70px 0 36px; min-width: 640px; max-width: 1180px; }
  #victoire .gagnant .n { font-family: var(--cond); font-weight: 800; font-size: 96px; line-height: 1.1; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  #victoire .gagnant .f { font-size: 26px; font-weight: 600; opacity: .92; }
  #victoire .sc { margin-left: -20px; background: var(--nuit); display: flex; align-items: center; gap: 18px; padding: 0 64px 0 56px; font-family: var(--cond); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  #victoire .sc .g { font-size: 110px; color: var(--texte); }
  #victoire .sc .t { font-size: 60px; color: #8F867A; }
  #victoire .sc .l { font-size: 110px; color: #8F867A; }
  #victoire .detail { align-self: flex-start; margin-top: 4px; background: rgba(22,19,15,.9); font-family: var(--cond); font-weight: 600; font-size: 26px; padding: 6px 36px 6px 22px; --biais: 12px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }

  /* ---------- Commentateur (bas gauche, monte au-dessus du récap / de la victoire) ---------- */
  #commentateur { position: absolute; left: 48px; bottom: 64px; display: flex; flex-direction: column; filter: drop-shadow(0 8px 22px rgba(0,0,0,.45)); transition: opacity .25s ease-out, transform .25s ease-out, bottom .3s ease-out; }
  #commentateur .tete { align-self: flex-start; font-family: var(--cond); font-weight: 800; font-size: 24px; letter-spacing: 3px; padding: 5px 34px 5px 20px; --biais: 14px; text-transform: uppercase; }
  #commentateur .corps { display: flex; height: 118px; }
  #commentateur .qui { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 60px 0 26px; background: var(--encre); --biais: 24px; }
  #commentateur .prenom { font-family: var(--cond); font-weight: 800; font-size: 60px; line-height: 1; letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap; }
  #commentateur .insta { display: flex; align-items: center; gap: 10px; font-family: var(--cond); font-weight: 700; font-size: 28px; letter-spacing: .5px; color: var(--doux); white-space: nowrap; }
  #commentateur .insta svg { width: 26px; height: 26px; color: var(--braise); flex: 0 0 auto; }
  #commentateur .rs { position: relative; margin-left: -20px; width: 400px; background: var(--nuit); --biais: 24px; }
  #commentateur .r { position: absolute; inset: 0; display: flex; align-items: center; gap: 18px; padding: 0 54px 0 46px; opacity: 0; transition: opacity .6s ease; }
  #commentateur .r.on { opacity: 1; }
  #commentateur .r svg { width: 46px; height: 46px; color: var(--braise); flex: 0 0 auto; }
  #commentateur .r .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  #commentateur .r .h { font-family: var(--cond); font-weight: 800; font-size: 40px; line-height: 1.05; white-space: nowrap; }
  #commentateur .r .l { font-family: var(--cond); font-weight: 600; font-size: 21px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--doux); white-space: nowrap; }

  /* ---------- Affiche (plein écran, caméra assombrie) ---------- */
  #affiche { position: absolute; inset: 0; }
  #affiche .voile { position: absolute; inset: 0; background: rgba(10,8,6,.62); }
  #affiche .compet { position: absolute; left: 0; right: 0; top: 250px; display: flex; justify-content: center; }
  #affiche .compet div { background: var(--braise); color: var(--encre); font-family: var(--cond); font-weight: 700; font-size: 32px; letter-spacing: 3px; padding: 8px 44px; --biais: 14px; text-transform: uppercase; }
  #affiche .face { position: absolute; left: 0; right: 0; top: 330px; height: 360px; display: flex; }
  #affiche .moitie { flex: 1 1 0; display: flex; align-items: center; gap: 44px; }
  #affiche .moitie.a { clip-path: polygon(0 0, 100% 0, calc(100% - 90px) 100%, 0 100%); justify-content: flex-end; padding-right: 190px; }
  #affiche .moitie.b { margin-left: -90px; clip-path: polygon(90px 0, 100% 0, 100% 100%, 0 100%); justify-content: flex-start; padding-left: 190px; }
  #affiche .txt { display: flex; flex-direction: column; gap: 8px; max-width: 520px; }
  #affiche .a .txt { align-items: flex-end; text-align: right; }
  #affiche .txt .n { font-family: var(--cond); font-weight: 800; font-size: 92px; line-height: .95; letter-spacing: 1px; text-transform: uppercase; }
  #affiche .txt .s { font-size: 28px; font-weight: 600; opacity: .92; }
  #affiche .logo { width: 196px; height: 196px; flex: 0 0 auto; border-radius: 50%; background: var(--texte); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(255,255,255,.18); overflow: hidden; font-family: var(--cond); font-weight: 800; font-size: 64px; }
  #affiche .logo img { width: 80%; height: 80%; object-fit: contain; }
  #affiche .vs { position: absolute; left: 0; right: 0; top: 454px; display: flex; justify-content: center; }
  #affiche .vs div { width: 112px; height: 112px; background: var(--encre); transform: rotate(45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 6px var(--braise); }
  #affiche .vs span { transform: rotate(-45deg); font-family: var(--cond); font-weight: 800; font-size: 50px; color: var(--braise); }
  #affiche .infos { position: absolute; left: 0; right: 0; top: 730px; display: flex; justify-content: center; }
  #affiche .infos div { background: rgba(22,19,15,.95); display: flex; align-items: center; gap: 28px; padding: 14px 40px; font-family: var(--cond); font-weight: 600; font-size: 34px; letter-spacing: 1px; }
  #affiche .infos i { width: 9px; height: 9px; background: var(--braise); transform: rotate(45deg); }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div id="affiche" class="bloc cache" aria-hidden="true"></div>

  <div id="zoneScore">
  <div id="score" class="bloc gauche cache">
    <div class="onglets"><div class="ong compet bz-d" id="sCompet"></div><div class="ong set bz" id="sSet"></div></div>
    <div class="ligne" id="lA"><div class="nom bz-d" id="nA"></div><div class="case serv bz"><img id="bA" src="assets/ballon.png" alt=""></div><div class="case sets bz" id="stA">0</div><div class="case pts bz" id="pA">0</div></div>
    <div class="ligne" id="lB"><div class="nom bz-d" id="nB"></div><div class="case serv bz"><img id="bB" src="assets/ballon.png" alt=""></div><div class="case sets bz" id="stB">0</div><div class="case pts bz" id="pB">0</div></div>
    <div class="histo" id="histo"></div>
  </div>
  <div id="cote" class="bandeau" hidden><div class="a braise bz-d">Changement de côté</div></div>
  <div id="tm" class="bandeau" hidden><div class="a bz-d" id="tmEq"></div><div class="b bz">TEMPS MORT <em id="tmSec"></em></div></div>
  <div id="serie" class="bandeau" hidden><div class="a braise bz-d">Série</div><div class="b bz" id="serieTxt"></div></div>
  </div>
  <div id="honneur" class="bloc gauche cache"></div>

  <div id="effectif" class="bloc cache" aria-hidden="true"></div>
  <div id="recap" class="bloc bas cache"></div>
  <div id="victoire" class="bloc bas cache"></div>
  <div id="commentateur" class="bloc gauche cache"></div>
</div>

<script src="config.js"></script>
<script type="module">
import { CFG, $, $$, param, esc, monterScene, surSignalRecharge } from "./shared/outils.js";
import { connecter } from "./shared/firebase.js";
import { calculer } from "./shared/moteur.js";
import { dateLongue, heureCourte } from "./shared/donnees.js";

monterScene($("#scene"));
if (param("apercu") === "1") document.body.classList.add("apercu");

const api = await connecter();
let live = {};
api.ecouter("live", (v) => { live = v || {}; surSignalRecharge(live.recharger); rendre(); });

const montrer = (el, oui) => el.classList.toggle("cache", !oui);
const couleurs = (el, eq) => { el.style.background = eq.couleur; el.style.color = eq.texte; };
let cleAffiche = "", cleRecap = "", cleVictoire = "", cleEffectif = "", cleHonneur = "";

function rendre() {
  const m = live.match;
  if (!m) { document.querySelectorAll(".bloc").forEach((b) => montrer(b, false)); return; }
  const now = api.maintenant();
  const etat = calculer(m.format, live.points || "", live.corrections || {});
  const h = live.habillage || null;
  const visible = !live.masque;
  const type = h?.type || null;
  const expire = h?.duree && now - (h.ts || 0) > h.duree;
  const hType = expire ? null : type;

  // --- Effectif : toute l'équipe d'un coup ---
  let effVisible = false;
  if (hType === "joueurs") {
    const eq = m[h.eq || m.suivi || "A"];
    if (eq?.joueurs?.length) {
      const cle = JSON.stringify([h.eq, eq]);
      if (cle !== cleEffectif) { cleEffectif = cle; $("#effectif").innerHTML = htmlEffectif(eq); ajusterNoms(); }
      effVisible = true;
    }
  }
  montrer($("#effectif"), visible && effVisible);

  // --- Plaque de score ---
  $("#sCompet").textContent = m.competition || "";
  $("#sCompet").hidden = !m.competition;
  $("#sSet").textContent = etat.fini ? "FIN DU MATCH" : etat.courant.tieBreak ? "TIE-BREAK" : `SET ${etat.courant.num}`;
  for (const c of ["A", "B"]) {
    const eq = m[c];
    const n = $("#n" + c);
    n.textContent = eq.court; couleurs(n, eq);
    $("#st" + c).textContent = etat.gagnes[c];
    const pts = etat.fini ? (etat.sets.at(-1)?.[c] ?? 0) : etat.courant[c];
    $("#p" + c).textContent = pts;
    $("#b" + c).classList.toggle("non", etat.service !== c);
  }
  const ptsA = etat.fini ? 0 : etat.courant.A, ptsB = etat.fini ? 0 : etat.courant.B;
  $("#lA").classList.toggle("mene", etat.fini ? etat.gagnant === "A" : ptsA >= ptsB);
  $("#lB").classList.toggle("mene", etat.fini ? etat.gagnant === "B" : ptsB >= ptsA);
  const histo = etat.sets.map((s, i) => `<div class="${i ? "bz" : "bz-d"}">S${i + 1} · ${s.A}-${s.B}</div>`).join("");
  if ($("#histo").innerHTML !== histo) $("#histo").innerHTML = histo;
  montrer($("#score"), visible && hType !== "affiche" && !effVisible);

  // --- Changement de côté au tie-break ---
  const plein = hType === "affiche" || effVisible;       // écran assombri : pas de bandeaux
  const depuisPoint = now - (live.dernierPoint || 0);
  const coteActif = etat.dernierChangeCote && depuisPoint < CFG.affichage.coteSec * 1000;
  $("#cote").hidden = !(visible && coteActif && !plein);

  // --- Temps mort : 30 s, retiré au point suivant ---
  const tm = live.tempsMort;
  const tmReste = tm ? Math.ceil((CFG.affichage.tempsMortSec * 1000 - (now - (tm.ts || now))) / 1000) : 0;
  const tmActif = !!tm && tmReste > 0 && (tm.n ?? -1) === (live.points || "").length && !etat.fini;
  if (tmActif) {
    const eqT = m[tm.eq];
    const el = $("#tmEq");
    el.textContent = eqT.court; el.style.background = eqT.couleur; el.style.color = eqT.texte;
    $("#tmSec").textContent = tmReste + " s";
  }
  $("#tm").hidden = !(visible && tmActif && !plein);

  // --- Série : à partir de 5 points d'affilée, quelques secondes après chaque point ---
  const serieActive = !live.serieCoupee && !etat.fini && etat.serie.n >= CFG.affichage.serieMin && depuisPoint < CFG.affichage.serieSec * 1000 && !etat.dernierChangeCote;
  if (serieActive) {
    const txt = `<em>${esc(m[etat.serie.eq].court)}</em> · ${etat.serie.n} points d'affilée`;
    if ($("#serieTxt").innerHTML !== txt) $("#serieTxt").innerHTML = txt;
  }
  $("#serie").hidden = !(visible && serieActive && !plein && !tmActif);

  // --- Club à l'honneur ---
  if (hType === "honneur") {
    const eqH = m[h.eq || m.suivi || "A"];
    const cle = JSON.stringify(eqH);
    if (cle !== cleHonneur) { cleHonneur = cle; $("#honneur").innerHTML = htmlHonneur(eqH); }
  }
  montrer($("#honneur"), visible && hType === "honneur");

  // --- Affiche ---
  if (hType === "affiche") {
    const cle = JSON.stringify([m.A, m.B, m.competition, m.date, m.heure, m.salle]);
    if (cle !== cleAffiche) { cleAffiche = cle; $("#affiche").innerHTML = htmlAffiche(m); ajuster("#affiche .txt .n", 44, 270); }
  }
  montrer($("#affiche"), visible && hType === "affiche");

  // --- Récap des sets ---
  if (hType === "recap") {
    const cle = JSON.stringify([etat.sets, etat.gagnes, m.A.court, m.B.court, h.titre]);
    if (cle !== cleRecap) { cleRecap = cle; $("#recap").innerHTML = htmlRecap(m, etat, h); ajuster("#recap .nom span", 24); }
  }
  montrer($("#recap"), visible && hType === "recap" && etat.sets.length > 0);

  // --- Victoire ---
  if (hType === "victoire" && etat.fini) {
    const cle = JSON.stringify([etat.sets, etat.gagnant, m.A.nom, m.B.nom]);
    if (cle !== cleVictoire) { cleVictoire = cle; $("#victoire").innerHTML = htmlVictoire(m, etat); ajuster("#victoire .gagnant .n", 48); }
  }
  montrer($("#victoire"), visible && hType === "victoire" && etat.fini);

  // --- Commentateur : indépendant des habillages, retiré au point suivant ---
  const comOn = visible && !!live.commentateur && !effVisible;
  if (comOn && !$("#commentateur").innerHTML) $("#commentateur").innerHTML = htmlCommentateur();
  if (comOn) {
    // Monte au-dessus du récap, de la victoire ou du club à l'honneur s'ils sont affichés en bas
    let haut = 0;
    for (const s of ["#recap", "#victoire", "#honneur"]) {
      const el = $(s);
      if (!el.classList.contains("cache")) haut = Math.max(haut, el.offsetHeight);
    }
    $("#commentateur").style.bottom = (64 + (haut ? haut + 22 : 0)) + "px";
    const rs = $$("#commentateur .r");
    if (rs.length) {
      const i = Math.floor(Date.now() / (COM.rotationSec * 1000)) % rs.length;
      rs.forEach((r, k) => r.classList.toggle("on", k === i));
    }
  }
  montrer($("#commentateur"), comOn);
}
setInterval(rendre, 200);

// Réduit la police d'un texte trop long pour sa case (noms de clubs à rallonge)
function ajuster(sel, min, hauteurMax) {
  document.querySelectorAll(sel).forEach((el) => {
    let t = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = "";
    t = parseFloat(getComputedStyle(el).fontSize);
    const trop = () => el.scrollWidth > el.clientWidth + 1 || (hauteurMax && el.scrollHeight > hauteurMax);
    while (trop() && t > min) { t -= 2; el.style.fontSize = t + "px"; }
  });
}

function htmlAffiche(m) {
  const cote = (c) => {
    const eq = m[c];
    const logo = `<div class="logo" style="color:${esc(eq.couleur)}">${eq.logo ? `<img src="${esc(eq.logo)}" alt="">` : esc(eq.court)}</div>`;
    const txt = `<div class="txt"><div class="n">${esc(eq.nom)}</div>${eq.sousTitre ? `<div class="s">${esc(eq.sousTitre)}</div>` : ""}</div>`;
    return `<div class="moitie ${c.toLowerCase()}" style="background:${esc(eq.couleur)};color:${esc(eq.texte)}">${c === "A" ? txt + logo : logo + txt}</div>`;
  };
  const infos = [[dateLongue(m.date), heureCourte(m.heure)].filter(Boolean).join(" · "), m.salle].filter(Boolean);
  return `<div class="voile"></div>
    ${m.competition ? `<div class="compet"><div class="bz">${esc(m.competition)}</div></div>` : ""}
    <div class="face">${cote("A")}${cote("B")}</div>
    <div class="vs"><div><span>VS</span></div></div>
    ${infos.length ? `<div class="infos"><div>${infos.map((x) => `<span>${esc(x)}</span>`).join("<i></i>")}</div></div>` : ""}`;
}

const ORDRE_POSTES = ["Passeur", "Pointu", "Réceptionneur-attaquant", "Central", "Polyvalent", "Libéro", ""];
const sansAccent = (x) => String(x || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/gi, "").toLowerCase();

function htmlEffectif(eq) {
  // Triés par poste comme une compo, puis par numéro
  const js = eq.joueurs.slice().sort((a, b) =>
    (ORDRE_POSTES.indexOf(a.poste || "") - ORDRE_POSTES.indexOf(b.poste || "")) || (Number(a.num) - Number(b.num)));
  const n = js.length;
  const cols = n <= 6 ? 3 : n <= 16 ? 4 : 5;
  const carte = (j) => {
    // Flocage identique au nom (ex. « SALIM ») : rien à ajouter
    const floc = j.flocage && !sansAccent(j.flocage).includes(sansAccent(j.nom)) ? j.flocage : "";
    const badges = (j.capitaine ? `<span class="badge">C</span>` : "") + (j.libero && j.poste !== "Libéro" ? `<span class="badge">L</span>` : "");
    return `<div class="j">
      <div class="num bz-d" style="background:${esc(eq.couleur)};color:${esc(eq.texte)}">${esc(j.num)}</div>
      <div class="infos bz">
        ${j.nom && j.prenom ? `<div class="prenom">${esc(j.prenom)}</div>` : ""}
        <div class="nomj">${esc(j.nom || j.prenom)}</div>
        <div class="detail">${j.poste ? `<span class="poste">${esc(j.poste === "Réceptionneur-attaquant" ? "Récep-attaque" : j.poste)}</span>` : ""}${badges}${floc ? `<span class="floc">Flocage <b>${esc(floc)}</b></span>` : ""}</div>
      </div></div>`;
  };
  return `<div class="voile"></div><div class="cadre">
    <div class="tete"><div class="n bz-d" style="background:${esc(eq.couleur)};color:${esc(eq.texte)}">${esc(eq.nom)}</div>${eq.sousTitre ? `<div class="s bz">${esc(eq.sousTitre)}</div>` : ""}</div>
    <div class="grille" style="grid-template-columns:repeat(${cols}, minmax(0, 1fr))">${js.map(carte).join("")}</div></div>`;
}

// Le nom entier doit rester lisible : on réduit la police plutôt que de couper
function ajusterNoms() {
  const el = document.querySelector("#effectif");
  el.classList.remove("cache");               // mesurable même pendant le fondu
  const etait = el.style.visibility; el.style.visibility = "hidden";
  document.querySelectorAll("#effectif .nomj").forEach((x) => {
    let t = 38; x.style.fontSize = t + "px";
    while (x.scrollWidth > x.clientWidth + 1 && t > 22) { t -= 1; x.style.fontSize = t + "px"; }
  });
  // Le flocage aussi : on le réduit un peu avant de le couper
  document.querySelectorAll("#effectif .floc").forEach((x) => {
    let t = 21; x.style.fontSize = t + "px";
    while (x.scrollWidth > x.clientWidth + 1 && t > 16) { t -= 1; x.style.fontSize = t + "px"; }
  });
  el.style.visibility = etait;
}

function htmlHonneur(eq) {
  const c = eq.club || {};
  const logo = `<div class="logo" style="color:${esc(eq.couleur)}">${eq.logo ? `<img src="${esc(eq.logo)}" alt="">` : esc(eq.court)}</div>`;
  const lignes = [
    c.creneaux ? `<div class="ligne"><b>Entraînements</b>${esc(c.creneaux)}</div>` : "",
    c.recrutement ? `<div class="ligne"><b>Recrutement</b>${esc(c.recrutement)}</div>` : "",
    (c.instagram || c.site) ? `<div class="reseaux">${esc([c.instagram, c.site].filter(Boolean).join("   ·   "))}</div>` : ""
  ].join("");
  return `<div class="tete braise bz-d">CLUB À L'HONNEUR</div>
    <div class="corps">
      <div class="club bz-d" style="background:${esc(eq.couleur)};color:${esc(eq.texte)}">${logo}<div class="nom">${esc(eq.nom)}</div></div>
      <div class="infos bz">${c.presentation ? `<div class="pres">${esc(c.presentation)}</div>` : ""}${lignes || (!c.presentation ? `<div class="pres">${esc(eq.sousTitre)}</div>` : "")}</div>
    </div>`;
}

function htmlRecap(m, etat, h) {
  const titre = h.titre || (etat.fini ? "Score final" : `Fin du set ${etat.sets.length}`);
  const ligne = (c) => `<div class="ligne">
      <div class="nom bz-d" style="background:${esc(m[c].couleur)};color:${esc(m[c].texte)}"><span>${esc(m[c].nom)}</span></div>
      ${etat.sets.map((s) => `<div class="c bz${s.gagnant === c ? " g" : ""}">${s[c]}</div>`).join("")}
      <div class="c tot bz">${etat.gagnes[c]}</div></div>`;
  return `<div class="tete bz-d">${esc(titre)}</div>${ligne("A")}${ligne("B")}`;
}

  twitch: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.5 2 3 5.8V20h4.8v2.5h2.7L13 20h3.8L21 15.8V2H4.5Zm14.6 12.9-2.9 2.9h-4.4l-2.5 2.5v-2.5H5.6V3.9h13.5v11Z"/><path d="M15.5 7.2h1.9v5.5h-1.9zM10.4 7.2h1.9v5.5h-1.9z"/></svg>`,
  youtube: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8ZM9.8 15.1V8.9l5.8 3.1-5.8 3.1Z"/></svg>`
};
const COM = Object.assign({
  titre: "Au micro", prenom: "Matthys", instagram: "@matthys62245",
  reseaux: [{ type: "twitch", texte: CFG.twitch || "silex62", legende: "En direct sur Twitch" }, { type: "youtube", texte: "@6silex", legende: "Replays sur YouTube" }],
  rotationSec: 8
}, CFG.commentateur || {});

function htmlCommentateur() {
  const rs = (COM.reseaux || []).map((r) => `<div class="r">${ICONES[r.type] || ""}<div class="t"><div class="h">${esc(r.texte)}</div>${r.legende ? `<div class="l">${esc(r.legende)}</div>` : ""}</div></div>`).join("");
  return `<div class="tete braise bz-d">${esc(COM.titre)}</div>
    <div class="corps">
      <div class="qui bz-d"><div class="prenom">${esc(COM.prenom)}</div>${COM.instagram ? `<div class="insta">${ICONES.instagram}<span>${esc(COM.instagram)}</span></div>` : ""}</div>
      ${rs ? `<div class="rs bz">${rs}</div>` : ""}
    </div>`;
}

function htmlVictoire(m, etat) {
  const g = etat.gagnant, p = g === "A" ? "B" : "A";
  return `<div class="tete bz-d">VICTOIRE</div>
    <div class="corps">
      <div class="gagnant bz-d" style="background:${esc(m[g].couleur)};color:${esc(m[g].texte)};--biais:26px"><div class="n">${esc(m[g].nom)}</div><div class="f">face à ${esc(m[p].nom)}</div></div>
      <div class="sc bz" style="--biais:26px"><span class="g">${etat.gagnes[g]}</span><span class="t">–</span><span class="l">${etat.gagnes[p]}</span></div>
    </div>
    <div class="detail bz-d">${etat.sets.map((s) => `${s.A}-${s.B}`).join("   ·   ")}</div>`;
}
