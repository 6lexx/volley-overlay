<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     THÈME — tout le visuel se règle ici.
     Tailles en vh : elles suivent la hauteur de l'image.
     ========================================================= */
  :root {
    /* Couleurs du club */
    --red:       #D3121F;   /* plaque principale */
    --red-deep:  #8E0A13;
    --white:     #FFFFFF;
    --ink:       #1A1416;   /* texte sombre, losange "set en cours" */
    --loser:     #8A8085;   /* score perdant dans l'historique */

    /* Typo */
    --num:   "Big Shoulders Display", "Arial Narrow", sans-serif;
    --small: "Barlow Condensed", "Arial Narrow", sans-serif;

    /* Placement (aussi via ?pos=br|bl|tr|tl) — défaut : bas droite */
    --top:    auto;
    --bottom: 6vh;
    --left:   auto;
    --right:  4vw;
    --align:  flex-end;

    /* Taille globale (aussi via ?scale=1.2) */
    --scale: 1;

    /* Inclinaison des losanges */
    --skew: -12deg;

    /* Dimensions dérivées */
    --score-size: calc(8.2vh * var(--scale));
    --name-size:  calc(3.3vh * var(--scale));
    --tab-size:   calc(2.5vh * var(--scale));
    --dia-size:   calc(1.6vh * var(--scale));
    --ball-size:  calc(2.8vh * var(--scale));
    --crest-size: calc(11vh  * var(--scale));

    /* Animations */
    --anim: .22s;
    --fade: .35s;
  }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: transparent !important;
    overflow: hidden;
  }

  .bug {
    position: fixed;
    top: var(--top); bottom: var(--bottom); left: var(--left); right: var(--right);
    display: flex; flex-direction: column; align-items: var(--align);
    gap: calc(.9vh * var(--scale));
    transition: opacity var(--fade) ease, transform var(--fade) ease;
  }
  .bug.hidden { opacity: 0; transform: translateY(2vh); }
  .bug.top { flex-direction: column-reverse; }   /* en haut : losanges sous la plaque */

  /* Tout ce qui est incliné : le parent penche, le contenu se redresse */
  .skew   { transform: skewX(var(--skew)); }
  .unskew { transform: skewX(calc(var(--skew) * -1)); display: inline-flex; align-items: center; }

  /* ---------- Losanges d'info : scores des sets + set en cours ---------- */
  .tabs { display: flex; gap: calc(.8vh * var(--scale)); }
  .tab {
    background: var(--white); color: var(--ink);
    font: 700 var(--tab-size)/1 var(--small);
    padding: calc(.9vh * var(--scale)) calc(1.5vh * var(--scale));
    box-shadow: 0 .4vh 1vh rgba(0, 0, 0, .3);
    font-variant-numeric: tabular-nums;
  }
  .tab .w { color: var(--red); }
  .tab .l { color: var(--loser); }
  .tab .dash { color: var(--loser); margin: 0 .25em; }
  .tab.now  { background: var(--ink); color: var(--white); }
  .tab.win  { background: var(--red); color: var(--white); }
  .tab.enter { animation: tabIn .45s cubic-bezier(.2, .9, .3, 1.2); }
  @keyframes tabIn {
    from { opacity: 0; transform: skewX(var(--skew)) translateX(3vh); }
    to   { opacity: 1; transform: skewX(var(--skew)) translateX(0); }
  }

  /* ---------- Écusson du club (pastille blanche, chevauche la plaque) ---------- */
  .plate { display: flex; align-items: center; }
  .crest {
    position: relative; z-index: 2; flex: none;
    width: var(--crest-size); height: var(--crest-size);
    margin-right: calc(var(--crest-size) * -.32);
    border-radius: 50%; background: var(--white);
    border: calc(.6vh * var(--scale)) solid var(--red);
    box-shadow: 0 .6vh 1.6vh rgba(0, 0, 0, .35);
    display: grid; place-items: center; overflow: hidden;
  }
  .crest img { width: 94%; height: 94%; object-fit: contain; }
  .crest:empty { display: none; }

  /* ---------- Plaque rouge : noms, sets, scores ---------- */
  .slab {
    display: flex; align-items: center;
    background: var(--red);
    padding: calc(.8vh * var(--scale)) calc(2.6vh * var(--scale)) calc(.8vh * var(--scale)) calc(4.6vh * var(--scale));
    box-shadow: 0 .6vh 1.6vh rgba(0, 0, 0, .35);
  }
  .slab > .unskew { gap: calc(1.6vh * var(--scale)); }

  .side { display: flex; flex-direction: column; align-items: center; gap: calc(.7vh * var(--scale)); }
  .tn {
    display: flex; align-items: center; gap: calc(.6vh * var(--scale));
    font: 800 var(--name-size)/1 var(--num); color: var(--white);
    letter-spacing: .04em; white-space: nowrap;
  }
  .tlabel { border-bottom: calc(.4vh * var(--scale)) solid var(--mark, transparent); padding-bottom: .1vh; }

  .ball {
    font-size: var(--ball-size); line-height: 1;
    display: inline-block;
    opacity: 0; transform: scale(.3) rotate(-90deg);
    transition: opacity var(--anim), transform .35s cubic-bezier(.2, .9, .3, 1.3);
  }
  .side.serving .ball { opacity: 1; transform: scale(1) rotate(0); }

  /* Sets : losanges vides qui se remplissent */
  .dia { display: flex; gap: calc(.9vh * var(--scale)); }
  .dia i {
    width: var(--dia-size); height: var(--dia-size);
    border: calc(.3vh * var(--scale)) solid var(--white); box-sizing: border-box;
    transform: rotate(45deg);
    background: transparent;
    transition: background .4s ease;
  }
  .dia i.on { background: var(--white); }

  .n {
    font: 900 var(--score-size)/1 var(--num); color: var(--white);
    font-variant-numeric: tabular-nums; width: 1.15em; text-align: center;
  }
  .n.bump { animation: bump var(--anim) ease-out; }
  @keyframes bump { 45% { transform: scale(1.18); } }

  .sep { width: calc(.5vh * var(--scale)); height: calc(5.8vh * var(--scale)); background: var(--white); opacity: .9; }

  /* =========================================================
     VICTOIRE DU MATCH — les bandeaux
     Unités cqh / cqw : % de la hauteur / largeur de l'image
     ========================================================= */
  .bug.fx-hide { opacity: 0; transform: translateY(2vh); }
  .fx-root { position: fixed; inset: 0; container-type: size; pointer-events: none; z-index: 5; }
  .vfx { position: absolute; inset: 0; overflow: hidden; font-family: var(--num); color: var(--f); }
  .vfx .u { display: inline-block; transform: skewX(12deg); white-space: nowrap; }
  .vfx .rib { position: absolute; left: -20cqw; width: 140cqw; overflow: hidden; display: flex; align-items: center; box-shadow: 0 .8cqh 2cqh rgba(0,0,0,.3); }
  .vfx .rib.r1 { bottom: 22cqh; height: 12cqh; background: var(--c); color: var(--f); }
  .vfx .rib.r2 { bottom: 9cqh; height: 9cqh; background: var(--white); color: var(--ink); }
  .vfx .track { display: flex; align-items: center; gap: 3cqh; white-space: nowrap; padding-left: 3cqh; font-weight: 900; line-height: 1; will-change: transform; }
  .vfx .r1 .track { font-size: 9cqh; letter-spacing: .4cqh; }
  .vfx .r2 .track { font-family: var(--small); font-weight: 700; font-size: 6cqh; letter-spacing: .3cqh; }
  .vfx .dot { width: 1.6cqh; height: 1.6cqh; flex: none; transform: rotate(45deg); background: currentColor; }
  .vfx .plq { position: absolute; left: 50%; bottom: 14cqh; background: var(--ink); color: var(--white); border: .6cqh solid var(--white); padding: 1.6cqh 2cqh; box-shadow: 0 1cqh 3cqh rgba(0,0,0,.4); }
  .vfx .plq .u { display: flex; align-items: center; gap: 2.4cqh; }
  .vfx .fx-crest { width: 11cqh; height: 11cqh; flex: none; border-radius: 50%; background: var(--white); box-shadow: 0 0 0 .5cqh var(--c); display: flex; align-items: center; justify-content: center; }
  .vfx .fx-crest img { width: 86%; height: 86%; object-fit: contain; }
  .vfx .fx-crest .ini { font-weight: 900; font-size: 4.6cqh; }
  .vfx .pname { font-weight: 900; font-size: 7cqh; line-height: 1; }
  .vfx .ptot { transform: skewX(var(--skew)); background: var(--c); color: var(--f); padding: .6cqh 2.2cqh; font-weight: 900; font-size: 8cqh; line-height: 1; }

  /* =========================================================
     FIN DE SET — le volet
     ========================================================= */
  .sfx { position: absolute; inset: 0; overflow: hidden; font-family: var(--num); color: var(--f); }
  /* Le volet — fin de set */
  .sfx .wp { position: absolute; top: -10cqh; left: -30cqw; width: 160cqw; height: 120cqh; }
  .sfx .wbox { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3cqh; }
  .sfx .w-k { font-family: var(--small); font-weight: 700; font-size: 4.6cqh; letter-spacing: .8cqh; line-height: 1; }
  .sfx .w-line { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start; column-gap: 5cqh; width: min(160cqh, 92cqw); }
  .sfx .w-side { display: flex; flex-direction: column; align-items: center; gap: 2.2cqh; min-width: 0; text-align: center; }
  .sfx .w-pt { font-weight: 900; font-size: 26cqh; line-height: .9; font-variant-numeric: tabular-nums; }
  .sfx .w-team { font-weight: 900; font-size: var(--tn, 6.4cqh); line-height: 1; letter-spacing: .2cqh; text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; max-width: 100%; }
  .sfx .lose { opacity: .5; }
  .sfx .w-d { font-weight: 900; font-size: 14cqh; line-height: 1; opacity: .8; margin-top: 5cqh; }
  .sfx .w-dia { display: flex; gap: 2.8cqh; margin-top: .6cqh; }
  .sfx .w-dia i { position: relative; width: 4.2cqh; height: 4.2cqh; border: .7cqh solid var(--f); box-sizing: border-box; transform: rotate(45deg); transition: background .2s; }
  .sfx .w-dia i.on { background: var(--f); }
  .sfx .w-ring { position: absolute; inset: -.6cqh; border: .5cqh solid var(--f); }

  /* =========================================================
     ACE — le chant et la frappe (RMV), la pastille (adversaire)
     ========================================================= */
  .afx { position: absolute; inset: 0; z-index: 10; pointer-events: none; overflow: hidden; font-family: var(--num); color: var(--f); }
  .afx .u { display: inline-block; transform: skewX(12deg); white-space: nowrap; }

  /* Le chant */
  .afx .ac-word { position: absolute; top: 70cqh; }
  .afx .ac-blk { transform: skewX(-12deg); background: var(--c); color: var(--f); font-weight: 900; font-size: 13cqh; line-height: 1; padding: 1cqh 3cqh .6cqh; letter-spacing: .4cqh; box-shadow: 0 1cqh 2.6cqh rgba(0,0,0,.35); }
  .afx .ac-word.alt .ac-blk { background: #fff; color: #1A1416; }
  .afx .ac-burst { position: absolute; left: 50%; top: 70cqh; width: 0; height: 0; }
  .afx .ac-ring { position: absolute; left: -5cqh; top: -5cqh; width: 10cqh; height: 10cqh; box-sizing: border-box; border: .8cqh solid #fff; }
  .afx .ac-spark { position: absolute; left: -.4cqh; top: -2cqh; width: .8cqh; height: 4cqh; background: #fff; border-radius: .4cqh; }
  .afx .ac-count { position: absolute; left: 50%; top: 86cqh; transform: translateX(-50%); font-family: var(--small); font-weight: 700; font-size: 4cqh; letter-spacing: .5cqh; color: #fff; background: #1A1416; padding: 1cqh 2.4cqh; white-space: nowrap; }
  .afx .ac-clap { position: absolute; left: 50%; top: 52cqh; font-family: var(--small); font-weight: 700; font-size: 4.4cqh; letter-spacing: 1cqh; color: #fff; text-shadow: 0 .4cqh 1.2cqh rgba(0,0,0,.5); }

  /* La pastille */
  .afx .ab { position: absolute; display: flex; flex-direction: column; align-items: flex-end; gap: .6cqh; }
  .afx .ab-top { transform: skewX(-12deg); background: var(--c); color: var(--f); font-weight: 900; font-size: 9cqh; line-height: 1; padding: .8cqh 3cqh .5cqh; letter-spacing: .5cqh; box-shadow: 0 .6cqh 1.6cqh rgba(0,0,0,.35); }
  .afx .ab-sub { transform: skewX(-12deg); background: #1A1416; color: #fff; font-family: var(--small); font-weight: 700; font-size: 3.2cqh; line-height: 1; padding: 1cqh 2cqh; letter-spacing: .3cqh; }

  /* La frappe */
  .afx .af-ball { position: absolute; left: 0; top: 0; width: 10cqh; height: 10cqh; }
  .afx .af-ball svg { width: 100%; height: 100%; display: block; }
  .afx .af-ghost { opacity: .35; }
  .afx .af-burst { position: absolute; width: 0; height: 0; }
  .afx .af-letters { position: absolute; display: flex; gap: 1.2cqh; }
  .afx .af-l { transform: skewX(-12deg); background: var(--c); color: var(--f); font-weight: 900; font-size: 16cqh; line-height: 1; padding: .8cqh 2.4cqh .4cqh; box-shadow: 0 1cqh 2.6cqh rgba(0,0,0,.35); }
  .afx .af-l:nth-child(2) { background: #fff; color: #1A1416; }
  .afx .af-team { position: absolute; font-family: var(--small); font-weight: 700; font-size: 4cqh; letter-spacing: .8cqh; color: #fff; text-shadow: 0 .4cqh 1.2cqh rgba(0,0,0,.5); }

  /* =========================================================
     HORLOGE — petit losange blanc, coin opposé au score
     ========================================================= */
  .clock {
    position: fixed; z-index: 2; bottom: 6vh; left: 4vw;
    transform: skewX(var(--skew));
    background: var(--white); color: var(--ink);
    font: 800 calc(2.9vh * var(--scale))/1 var(--num); letter-spacing: .04em;
    padding: calc(.9vh * var(--scale)) calc(1.7vh * var(--scale));
    box-shadow: 0 .4vh 1vh rgba(0, 0, 0, .3);
    font-variant-numeric: tabular-nums;
    transition: opacity var(--fade) ease, bottom .6s cubic-bezier(.16, 1, .3, 1);
  }
  .clock.hidden, .clock.fx-hide { opacity: 0; }

  /* =========================================================
     ÉCHAUFFEMENT — cartes joueurs fixes, renouvelées en fondu
     Tout est en "em" : 1em = 1vh × échelle (réglé sur .wu)
     ========================================================= */
  .bug.wu-hide, .bug.ti-hide { opacity: 0; transform: translateY(2vh); }
  .clock.ti-hide { opacity: 0; }
  .wu {
    position: fixed; z-index: 3; left: 4vw; right: 4vw; bottom: 4vh;
    font-size: calc(1vh * var(--scale));
    display: flex; align-items: flex-start; gap: 4em;
    opacity: 0; transform: translateY(3em);
    transition: opacity .5s ease, transform .7s cubic-bezier(.16, 1, .3, 1);
    pointer-events: none;
  }
  .wu.show { opacity: 1; transform: none; }

  /* Bloc affiche : ÉCHAUFFEMENT + les deux équipes */
  .wu-head { flex: none; max-width: 30vw; margin-top: 21em; transform: skewX(var(--skew)); background: var(--ink); padding: 1.3em 2.6em; box-shadow: 0 .6em 1.6em rgba(0, 0, 0, .35); }
  .wu-hin { display: flex; flex-direction: column; gap: .8em; transform: skewX(calc(var(--skew) * -1)); min-width: 0; }
  .wu-k { display: flex; align-items: center; gap: .5em; font: 700 2.1em/1 var(--small); letter-spacing: .16em; color: var(--white); }
  .wu-k i { width: .55em; height: .55em; background: var(--red); transform: rotate(45deg); animation: wuPulse 1.6s ease-in-out infinite; }
  @keyframes wuPulse { 50% { opacity: .25; } }
  .wu-teams { display: flex; flex-direction: column; gap: .12em; font: 900 var(--wu-fs, 4em)/1 var(--num); letter-spacing: .04em; color: var(--white); text-transform: uppercase; min-width: 0; }
  .wu-teams > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wu-teams small { font: 700 .5em/1 var(--small); letter-spacing: .15em; color: var(--red); margin-right: .4em; }

  .wu-cards { flex: 1; min-width: 0; display: flex; gap: 2.6em; align-items: flex-start; }

  /* Carte joueur : silhouette, gros numéro blanc qui déborde, losange rouge du nom */
  .pc { flex: none; width: 31em; display: flex; flex-direction: column; }
  .pc-fig { height: 23em; margin-bottom: -2em; display: flex; justify-content: center; align-items: flex-end; filter: drop-shadow(0 .4em .8em rgba(0, 0, 0, .35)); }
  .pc-fig svg { height: 23em; width: 21em; display: block; }
  .pc-fig img { height: 100%; width: 100%; object-fit: contain; object-position: bottom; }
  .pc-plate { position: relative; z-index: 2; }
  .pc-band { transform: skewX(var(--skew)); background: var(--red); padding: .95em 1.4em .85em calc(var(--nd, 1) * 4.3em + 1.6em); box-shadow: 0 .5em 1.2em rgba(0, 0, 0, .35); }
  .pc-band span { display: block; transform: skewX(calc(var(--skew) * -1)); font: 900 var(--nf, 3.3em)/1 var(--num); color: var(--white); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc-num {
    position: absolute; left: .3em; bottom: .22em;
    font: 900 10em/.78 var(--num); color: var(--white);
    -webkit-text-stroke: .045em var(--ink); paint-order: stroke fill;
    text-shadow: 0 .03em .1em rgba(0, 0, 0, .45);
    font-variant-numeric: tabular-nums;
  }
  .pc-info { display: flex; flex-direction: column; align-items: flex-start; gap: .55em; margin-top: .7em; padding-left: 1.4em; }
  .pc-pos  { transform: skewX(var(--skew)); background: var(--white); color: var(--ink); padding: .5em 1.1em; max-width: 27em; box-shadow: 0 .4em 1em rgba(0, 0, 0, .3); }
  .pc-pos span { display: block; line-height: 1.15 !important; transform: skewX(calc(var(--skew) * -1)); font: 700 2.1em/1 var(--small); letter-spacing: .12em; text-transform: uppercase; }
  .pc-line { transform: skewX(var(--skew)); background: rgba(26, 20, 22, .92); color: var(--white); padding: .55em 1.1em; max-width: 27em; }
  .pc-line span { display: block; transform: skewX(calc(var(--skew) * -1)); font: 600 2.2em/1.15 var(--small); }

  /* =========================================================
     BANDEAUX DU COIN (inter-set, temps mort) — en "em" : 1em = 1vh × échelle
     ========================================================= */
  .bl { position: fixed; z-index: 3; left: 4vw; bottom: 6vh; font-size: calc(1vh * var(--scale)); display: flex; flex-direction: column; align-items: flex-start; gap: 1.2em; pointer-events: none; }
  .bl.right { left: auto; right: 4vw; align-items: flex-end; }
  .sk { transform: skewX(var(--skew)); }
  .sk > .u { display: block; transform: skewX(calc(var(--skew) * -1)); white-space: nowrap; }
  .dot { width: .55em; height: .55em; flex: none; background: var(--red); transform: rotate(45deg); animation: wuPulse 1.6s ease-in-out infinite; }

  /* Inter-set */
  .is { display: flex; flex-direction: column; align-items: flex-start; gap: .7em; filter: drop-shadow(0 .6em 1.2em rgba(0, 0, 0, .35)); }
  .is-k { background: var(--ink); color: var(--white); padding: .6em 1.4em; }
  .is-k .u { display: flex; align-items: center; gap: .5em; font: 700 2.1em/1 var(--small); letter-spacing: .16em; }
  .is-main { background: var(--red); color: var(--white); padding: .55em 2.2em .45em; }
  .is-main .u { display: flex; align-items: center; gap: .45em; font: 900 6.4em/1 var(--num); font-variant-numeric: tabular-nums; }
  .is-main .t { font-size: .5em; letter-spacing: .06em; }
  .is-main .d { opacity: .7; }
  .is-tabs { display: flex; flex-wrap: wrap; gap: .8em; padding-left: .6em; max-width: 60vw; }
  .is-tab { background: var(--white); color: var(--ink); padding: .5em 1.1em; }
  .is-tab .u { font: 700 2.5em/1 var(--small); font-variant-numeric: tabular-nums; }
  .is-tab .w { color: var(--red); } .is-tab .l { color: var(--loser); }
  .is-tab.dark { background: var(--ink); color: var(--white); }

  /* Temps mort */
  .to { filter: drop-shadow(0 .6em 1.2em rgba(0, 0, 0, .35)); }
  .to-main { background: var(--c, var(--red)); color: var(--f, #fff); padding: .9em 2.4em 1.1em; min-width: 30em; }
  .to-main .u { display: flex; flex-direction: column; gap: .45em; white-space: nowrap; }
  .to-row { display: flex; align-items: center; justify-content: space-between; gap: 2em; }
  .to-k { font: 700 2.2em/1 var(--small); letter-spacing: .2em; }
  .to-sec { font: 900 3.4em/1 var(--num); font-variant-numeric: tabular-nums; }
  .to-name { font: 900 var(--to-fs, 4.6em)/1 var(--num); letter-spacing: .04em; text-transform: uppercase; }
  .to-bar { height: .7em; background: rgba(0, 0, 0, .28); margin-top: .5em; overflow: hidden; }
  .to-bar i { display: block; height: 100%; background: currentColor; transform-origin: 0 50%; }

  /* =========================================================
     PRÉSENTATION DES ÉQUIPES — plein écran, façon compo
     ========================================================= */
  .ti { position: fixed; inset: 0; z-index: 4; font-size: calc(.74vh * var(--scale)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.4em; background: rgba(16, 12, 13, .86); pointer-events: none; }
  .ti[hidden] { display: none; }
  .ti-head { display: flex; align-items: center; gap: 3em; }
  .ti-crest { width: 17em; height: 17em; border-radius: 50%; background: var(--white); border: .9em solid var(--red); box-sizing: border-box; display: grid; place-items: center; overflow: hidden; flex: none; }
  .ti-crest img { width: 92%; height: 92%; object-fit: contain; }
  .ti-ttl { display: flex; flex-direction: column; gap: .9em; }
  .ti-k { font: 700 3em/1 var(--small); letter-spacing: .3em; color: var(--red); }
  .ti-name { font: 900 10em/.9 var(--num); letter-spacing: .03em; color: var(--white); text-transform: uppercase; }
  .ti-vs { font: 700 3.4em/1 var(--small); letter-spacing: .14em; color: rgba(255, 255, 255, .75); text-transform: uppercase; }
  .ti-grid { display: flex; flex-direction: column; align-items: center; gap: 2.6em; }
  .ti-row { display: flex; justify-content: center; gap: 2.6em; }

  .debug {
    position: fixed; left: 1vh; top: 1vh;
    font: 600 2vh system-ui, sans-serif; color: #fff;
    background: rgba(0, 0, 0, .6); padding: .5vh 1vh; border-radius: .6vh;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<script type="module">
// ===========================================================
//  Paramètres d'URL
//    m=volley-silex    identifiant du match (obligatoire hors démo)
//    pos=br|bl|tr|tl   coin d'ancrage (défaut : br, bas droite)
//    scale=1.2         taille globale
//    demo=1            faux match animé, sans Firebase (pour le design)
//    debug=1           affiche l'état de connexion (pas en live)
//    victoire=150      durée des bandeaux de victoire, en secondes (défaut 150)
//    clock=0           masque l'horloge
//    scene=warmup      (avec demo=1) affiche l'échauffement
//    rotation=7        échauffement : secondes avant de passer aux joueurs suivants
//    compo=20          présentation des équipes : durée d'affichage, en secondes
//    scene=interset|timeout|intro   (avec demo=1) aperçu des autres affichages
// ===========================================================
const qs    = new URLSearchParams(location.search);
const M     = qs.get("m");
const DEMO  = qs.get("demo") === "1";
const DEBUG = qs.get("debug") === "1";

const rootStyle = document.documentElement.style;
const pos = qs.get("pos") || "br";
if (pos[0] === "t") {
  rootStyle.setProperty("--top", "4.5vh"); rootStyle.setProperty("--bottom", "auto");
  document.getElementById("bug").classList.add("top");
}
if (pos[1] === "l") {
  rootStyle.setProperty("--left", "4vw"); rootStyle.setProperty("--right", "auto");
  rootStyle.setProperty("--align", "flex-start");
}
if (qs.get("scale")) rootStyle.setProperty("--scale", qs.get("scale"));

const $ = (id) => document.getElementById(id);
const dbg = (msg) => { if (DEBUG) { $("debug").hidden = false; $("debug").textContent = msg; } };

// ===========================================================
//  Rendu
// ===========================================================
const other = (t) => (t === "A" ? "B" : "A");
const toArr = (x) => (Array.isArray(x) ? x.filter(Boolean) : x ? Object.values(x) : []);

function norm(s) {
  s.score    = s.score    ?? { A: 0, B: 0 };
  s.sets     = s.sets     ?? { A: 0, B: 0 };
  s.timeouts = s.timeouts ?? { A: 0, B: 0 };
  s.aces     = s.aces     ?? { A: 0, B: 0 };
  for (const k of ["score", "sets", "timeouts", "aces"]) { s[k].A ??= 0; s[k].B ??= 0; }
  s.history = toArr(s.history);
  s.visible = s.visible !== false;
  return s;
}

function setNum(el, value) {
  const v = String(value);
  if (el.textContent === v) return;
  const first = el.textContent === "";
  el.textContent = v;
  if (!first) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

let shownSets = -1;   // nombre de sets déjà affichés (pour animer le nouveau)

function render(s) {
  updateClock(s); updateWarmup(s); updateBanners(s);
  if (!s || !s.meta) { LAST = null; VolleyFX.stop(true); SetFX.stop(true); $("bug").classList.add("hidden"); return; }
  LAST = s;
  // Bandeaux de victoire en cours : on les retire si le match repart (annulation,
  // point, nouveau match) ou si l'overlay est masqué depuis l'appli.
  if (VolleyFX.running() && (!s.visible || (s.phase !== "matchEnd" && stateKey(s) !== fxKey))) VolleyFX.stop(true);
  if (SetFX.running() && (!s.visible || !setStillOver(s, setN))) SetFX.stop(true);
  if (!s.visible && !$("ti").hidden) stopIntro();
  if (AceFX.running() && aceRun && (!s.visible || s.aces[aceRun.team] < aceRun.n)) AceFX.stop(true);
  // Set gagné (25 points) : l'appli passe en "fin de set" → on lance l'animation
  if (prevPhase !== null && prevPhase !== "setEnd" && s.phase === "setEnd") onSetFinished(null, true, false);
  prevPhase = s.phase;
  if (playedN && !setStillOver(s, playedN)) { playedKey = null; playedN = 0; }   // set annulé : on pourra le rejouer
  const teams = s.meta.teams;
  const R = s.meta.rules;
  const order = s.swapped ? ["B", "A"] : ["A", "B"];

  // --- Écusson du club
  const logo = window.SCORE_CONFIG?.home?.logo || teams.A.logo;   // config.js prioritaire
  const crest = $("crest");
  if (logo && crest.dataset.src !== logo) {
    crest.dataset.src = logo;
    const img = new Image();
    img.onerror = () => crest.replaceChildren();          // logo introuvable : pas d'image cassée
    img.src = logo; img.alt = "";
    crest.replaceChildren(img);
  } else if (!logo && crest.dataset.src) { crest.replaceChildren(); delete crest.dataset.src; }

  // --- Plaque : noms, ballon de service, losanges de sets, scores
  document.querySelectorAll(".side").forEach((side) => {
    const t = order[Number(side.dataset.pos)];
    side.querySelector(".tlabel").textContent = teams[t].short;
    // Repère de couleur sous le nom de l'adversaire (l'équipe A est déjà en rouge)
    side.style.setProperty("--mark", t === "B" ? teams.B.color : "transparent");
    side.classList.toggle("serving", s.phase === "playing" && s.serving === t);

    const dia = side.querySelector(".dia");
    if (dia.children.length !== R.setsToWin) {
      dia.replaceChildren(...Array.from({ length: R.setsToWin }, () => el("i")));
    }
    // Losanges remplis depuis le score : côté gauche vers l'extérieur, côté droit aussi
    const kids = [...dia.children];
    if (side.dataset.pos === "0") kids.reverse();
    kids.forEach((d, i) => d.classList.toggle("on", i < s.sets[t]));
  });
  // Match terminé : la plaque affiche le résultat en sets (3 | 1) au lieu des points du dernier set
  const big = s.phase === "matchEnd" ? s.sets : s.score;
  document.querySelectorAll(".n").forEach((n) => setNum(n, big[order[Number(n.dataset.pos)]]));

  // --- Losanges d'info : score de chaque set terminé + set en cours
  const tabs = $("tabs");
  tabs.replaceChildren();
  s.history.forEach((h, i) => {
    const tab = el("div", "tab skew");
    const inner = el("span", "unskew");
    const [a, b] = order;
    inner.append(
      el("span", h.winner === a ? "w" : "l", h[a]),
      el("span", "dash", "-"),
      el("span", h.winner === b ? "w" : "l", h[b])
    );
    tab.appendChild(inner);
    if (shownSets >= 0 && i >= shownSets) tab.classList.add("enter");
    tabs.appendChild(tab);
  });
  shownSets = s.history.length;

  const tieBreak = s.setIndex === 2 * R.setsToWin - 1;
  let label, cls = "now";
  if (s.phase === "matchEnd")    { label = `Victoire ${teams[s.winner].short}`; cls = "win"; }
  else if (s.phase === "setEnd") label = `Fin du set ${s.setIndex}`;
  else                           label = tieBreak ? "Tie-break" : `Set ${s.setIndex}`;
  const now = el("div", `tab skew ${cls}`);
  now.appendChild(el("span", "unskew", label));
  tabs.appendChild(now);

  $("bug").classList.toggle("hidden", !s.visible);
}

// ===========================================================
//  VICTOIRE DU MATCH — les bandeaux
//  Déclenchée par l'événement "matchEnd" (fin du dernier set confirmée)
//  ou par le bouton "Victoire du match" de l'appli. Pendant les bandeaux,
//  le score s'efface ; il revient ensuite avec le résultat final.
// ===========================================================
const FX_HOLD = Math.max(5, Number(qs.get("victoire")) || 150) * 1000;
let LAST = null, fxKey = null, prevPhase = null;
const stateKey = (s) => `${s.phase}|${s.setIndex}|${s.score.A}-${s.score.B}|${s.history.length}`;

const VolleyFX = (() => {
  const EASE = { out: "cubic-bezier(.16,1,.3,1)", back: "cubic-bezier(.34,1.56,.64,1)", in: "cubic-bezier(.7,0,.84,0)" };
  const SCROLL_MS = 45000;          // vitesse de défilement (plus grand = plus lent)
  let cur = null;

  const h = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const rgb = (hex) => { const n = parseInt(String(hex).slice(1), 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const lum = (hex) => { const [r, g, b] = rgb(hex); return .299 * r + .587 * g + .114 * b; };

  function model(o) {
    const w = o.winner, l = other(w), T = o.teams, home = w === "A";
    const color = T[w]?.color || (home ? "#D3121F" : "#555555");
    return {
      short: T[w]?.short || "", name: (T[w]?.name || T[w]?.short || "").toUpperCase(),
      color, fg: lum(color) > 150 ? "#1A1416" : "#FFFFFF",
      total: `${o.sets[w]} – ${o.sets[l]}`,
      hist: (o.history || []).map((x) => `${x[w]}-${x[l]}`),
      aces: o.aces && (o.aces.A || o.aces.B) ? `ACES ${o.aces[w]} – ${o.aces[l]}` : null,
      logo: home ? o.logo : null
    };
  }
  function crest(m) {
    const c = h("div", "fx-crest");
    if (m.logo) { const i = new Image(); i.src = m.logo; i.alt = ""; i.onerror = () => i.remove(); c.append(i); }
    else { const s = h("span", "ini", m.short); s.style.color = m.color; c.append(s); }
    return c;
  }

  function finish(c) {
    c.anims.forEach((a) => { try { a.cancel(); } catch (e) {} });
    c.timers.forEach(clearTimeout);
    c.layer.remove();
    if (cur === c) cur = null;
    c.done && c.done();
  }

  // fast = true : sortie rapide (fondu) quand le match repart ou que l'overlay est masqué
  function stop(fast) {
    const c = cur;
    if (!c) return;
    cur = null;
    c.timers.forEach(clearTimeout);
    if (!fast) return finish(c);
    const a = c.layer.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: "forwards" });
    a.onfinish = () => finish(c);
  }

  function play(root, opts) {
    stop();
    const m = model(opts);
    const rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const L = h("div", "vfx");
    L.style.setProperty("--c", m.color);
    L.style.setProperty("--f", m.fg);
    root.append(L);
    const c = { layer: L, anims: [], timers: [] };
    cur = c;
    const A = (el, kf, o) => { const a = el.animate(kf, { fill: "both", easing: EASE.out, ...o }); c.anims.push(a); return a; };
    const OUT = 1200 + opts.hold;   // début de la sortie

    const ribbon = (cls, segs, dir, delay) => {
      const r = h("div", "rib " + cls), tr = h("div", "track");
      for (let k = 0; k < 2; k++) for (let i = 0; i < 8; i++) segs.forEach((s) => tr.append(h("span", null, s), h("i", "dot")));
      r.append(tr); L.append(r);
      const a = dir > 0 ? "-150cqw" : "150cqw", b = dir > 0 ? "150cqw" : "-150cqw";
      A(r, [{ transform: `rotate(-4deg) translateX(${a})` }, { transform: "rotate(-4deg) translateX(0)" }], { duration: 600, delay });
      A(r, [{ transform: "rotate(-4deg) translateX(0)" }, { transform: `rotate(-4deg) translateX(${b})` }], { duration: 520, delay: OUT + delay, easing: EASE.in, fill: "forwards" });
      if (!rm) A(tr, dir > 0
        ? [{ transform: "translateX(0)" }, { transform: "translateX(-50%)" }]
        : [{ transform: "translateX(-50%)" }, { transform: "translateX(0)" }],
        { duration: SCROLL_MS, easing: "linear", iterations: Infinity });
    };
    ribbon("r1", ["VICTOIRE", m.short], 1, 0);
    ribbon("r2", ["SETS " + m.total, ...m.hist, ...(m.aces ? [m.aces] : [])], -1, 120);

    const p = h("div", "plq"), u = h("div", "u");
    const tot = h("div", "ptot"); tot.append(h("span", "u", m.total));
    u.append(crest(m), h("div", "pname", m.name), tot);
    p.append(u); L.append(p);
    const sk = "translateX(-50%) skewX(-12deg)";
    A(p, [{ transform: sk + " scale(.3)", opacity: 0 }, { transform: sk + " scale(1)", opacity: 1 }], { duration: 560, delay: 650, easing: EASE.back });
    A(p, [{ transform: sk + " scale(1)", opacity: 1 }, { transform: sk + " scale(.6)", opacity: 0 }], { duration: 320, delay: OUT - 150, easing: EASE.in, fill: "forwards" });

    return new Promise((res) => {
      c.done = res;
      c.timers.push(setTimeout(() => { if (cur === c) { cur = null; finish(c); } }, OUT + 700));
    });
  }

  return { play, stop, running: () => !!cur };
})();

// Le set qui vient de se terminer, d'après l'état de l'appli :
//  - à 25 points, le set est "en attente" (phase setEnd, pas encore compté) ;
//  - après "Valider le set", il est dans l'historique et le set suivant a commencé.
function finishedSet(s) {
  if (!s || !s.meta) return null;
  const R = s.meta.rules || {};
  const toWin = R.setsToWin || 3;
  if (s.phase === "setEnd" && s.pendingWinner) {
    const w = s.pendingWinner;
    const sets = { ...s.sets, [w]: s.sets[w] + 1 };
    const row = { A: s.score.A, B: s.score.B, winner: w };
    return { n: s.setIndex, winner: w, points: { A: row.A, B: row.B }, sets, history: [...s.history, row], isMatch: sets[w] >= toWin };
  }
  const last = s.history[s.history.length - 1];
  if (!last) return null;
  return { n: s.history.length, winner: last.winner, points: { A: last.A, B: last.B }, sets: { ...s.sets }, history: s.history, isMatch: s.phase === "matchEnd" || s.sets[last.winner] >= toWin };
}
// Le set n est-il toujours terminé ? (sinon : annulation → on coupe l'animation)
const setStillOver = (s, n) => (s.phase === "setEnd" && s.setIndex === n) || s.history.length >= n;

let playedKey = null, playedN = 0;   // évite de rejouer la même fin de set (25 points puis validation)
const keyOf = (f) => `${f.n}|${f.points.A}-${f.points.B}`;

function startVictory(team, f) {
  const s = LAST;
  if (!s || !s.meta || !s.visible || VolleyFX.running()) return;
  f = f || finishedSet(s);
  const sets = f ? f.sets : s.sets, history = f ? f.history : s.history;
  const winner = team || (f && f.winner) || s.winner || (sets.A >= sets.B ? "A" : "B");
  SetFX.stop(); AceFX.stop(true);
  fxKey = stateKey(s);
  $("bug").classList.add("fx-hide"); $("clock").classList.add("fx-hide");
  VolleyFX.play($("fx"), {
    winner, hold: FX_HOLD, teams: s.meta.teams, sets, history, aces: s.aces,
    logo: window.SCORE_CONFIG?.home?.logo || s.meta.teams.A.logo
  }).then(() => {
    fxKey = null;
    $("bug").classList.remove("fx-hide"); $("clock").classList.remove("fx-hide");   // le score revient avec le résultat final
  });
}

// auto = déclenché par le jeu (25 points, validation) ; sinon bouton de l'appli
function onSetFinished(team, auto, forceMatch) {
  setTimeout(() => {                         // laisse arriver l'état à jour
    const f = finishedSet(LAST);
    if (!f) { if (forceMatch) startVictory(team); return; }
    if (auto && playedKey === keyOf(f)) return;
    playedKey = keyOf(f); playedN = f.n;
    if (f.isMatch || forceMatch) startVictory(team, f);
    else startSetFx(team, f);
  }, 400);
}

window.addEventListener("volley:event", (e) => {
  const ev = e.detail || {};
  if (ev.type === "matchEnd") onSetFinished(ev.team, true, true);
  if (ev.type === "matchWin") onSetFinished(ev.team, false, true);
  if (ev.type === "setEnd")   onSetFinished(ev.team, true, false);
  if (ev.type === "setWin")   onSetFinished(ev.team, false, false);
});

// ===========================================================
//  FIN DE SET — le volet
//  Déclenché par "setEnd" (set confirmé) ou le bouton "Victoire du set".
//  Le score se met à jour sous le volet ; le losange du set gagné se
//  remplit dans le volet avant qu'il se referme.
// ===========================================================

const SetFX = (() => {
  const EASE = { out: "cubic-bezier(.16,1,.3,1)", in: "cubic-bezier(.7,0,.84,0)", io: "cubic-bezier(.65,0,.35,1)" };
  let cur = null;
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const rgb = (hex) => { const n = parseInt(String(hex).slice(1), 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const lum = (hex) => { const [r, g, b] = rgb(hex); return .299 * r + .587 * g + .114 * b; };
  const shade = (hex, k) => "#" + rgb(hex).map((c) => Math.max(0, Math.min(255, Math.round(c * (1 + k)))).toString(16).padStart(2, "0")).join("");

  function model(o) {
    const w = o.winner, l = other(w), T = o.teams;
    const color = T[w]?.color || (w === "A" ? "#D3121F" : "#555555");
    return { w, l, T, color, deep: shade(color, -.45), fg: lum(color) > 150 ? "#1A1416" : "#FFFFFF", n: o.setIndex, pts: o.points, sets: o.sets };
  }
  function finish(c) {
    c.anims.forEach((a) => { try { a.cancel(); } catch (e) {} });
    c.timers.forEach(clearTimeout);
    c.layer.remove();
    if (cur === c) cur = null;
    c.done && c.done();
  }
  function stop(fast) {
    const c = cur;
    if (!c) return;
    cur = null;
    c.timers.forEach(clearTimeout);
    if (!fast) return finish(c);
    const a = c.layer.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: "forwards" });
    a.onfinish = () => finish(c);
  }
  function play(root, o) {
    stop();
    const m = model(o);
    const L = h("div", "sfx");
    L.style.setProperty("--c", m.color); L.style.setProperty("--d", m.deep); L.style.setProperty("--f", m.fg);
    root.append(L);
    const c = { layer: L, anims: [], timers: [], land: () => {} };
    cur = c;
    const A = (el, kf, x) => { const a = el.animate(kf, { fill: "both", easing: EASE.out, ...x }); c.anims.push(a); return a; };
    const total = BUILD.wipe(L, m, A, o, c);
    return new Promise((res) => { c.done = res; c.timers.push(setTimeout(() => { if (cur === c) { cur = null; finish(c); } }, total)); });
  }
  const BUILD = {
    /* Le volet : balayage plein écran, score du set, noms complets et losanges des sets.
       Le losange du set gagné se remplit avant que le volet se referme. */
    wipe(L, m, A, o, c) {
      [["var(--d)", 0], ["var(--c)", 90]].forEach(([bg, dl]) => {
        const p = h("div", "wp"); p.style.background = bg; L.append(p);
        A(p, [{ transform: "translateX(170cqw) skewX(-12deg)" }, { transform: "translateX(0) skewX(-12deg)" }], { duration: 480, delay: dl, easing: EASE.io });
        A(p, [{ transform: "translateX(0) skewX(-12deg)" }, { transform: "translateX(-180cqw) skewX(-12deg)" }], { duration: 520, delay: 4000 + (90 - dl), easing: EASE.io, fill: "forwards" });
      });
      const N = o.setsToWin || 3;
      const names = { A: m.T.A.name || m.T.A.short || "", B: m.T.B.name || m.T.B.short || "" };
      const longest = Math.max(names.A.length, names.B.length);
      const tn = longest > 24 ? "4.2cqh" : longest > 16 ? "5.2cqh" : "6.4cqh";   // noms longs : un peu plus petit
      let fresh = null;
      const side = (t) => {
        const lose = t === m.w ? "" : " lose";
        const s = h("div", "w-side");
        const name = h("span", "w-team" + lose, names[t]);
        name.style.setProperty("--tn", tn);
        const dia = h("div", "w-dia");
        const kids = Array.from({ length: N }, () => h("i"));
        dia.append(...kids);
        const order = t === "A" ? [...kids].reverse() : kids;   // comme le score : on remplit depuis le centre
        const before = m.sets[t] - (t === m.w ? 1 : 0);
        order.forEach((k, i) => k.classList.toggle("on", i < before));
        if (t === m.w) fresh = order[m.sets[t] - 1] || null;
        s.append(h("span", "w-pt" + lose, String(m.pts[t])), dia, name);   // losanges alignés sous les points, le nom peut passer sur 2 lignes
        return s;
      };
      const box = h("div", "wbox"), line = h("div", "w-line");
      line.append(side("A"), h("span", "w-d", "–"), side("B"));
      box.append(h("div", "w-k", `FIN DU SET ${m.n}`), line);
      L.append(box);
      A(box, [{ opacity: 0, transform: "translateX(6cqw)" }, { opacity: 1, transform: "translateX(0)" }], { duration: 420, delay: 420 });
      A(box, [{ opacity: 1, transform: "translateX(0)" }, { opacity: 0, transform: "translateX(-8cqw)" }], { duration: 320, delay: 3900, easing: EASE.in, fill: "forwards" });
      if (fresh) c.timers.push(setTimeout(() => {
        fresh.classList.add("on");
        A(fresh, [{ transform: "rotate(45deg) scale(1)" }, { transform: "rotate(45deg) scale(1.8)" }, { transform: "rotate(45deg) scale(1)" }], { duration: 520, fill: "none" });
        const r = h("span", "w-ring"); fresh.append(r);
        A(r, [{ transform: "scale(1)", opacity: 1 }, { transform: "scale(3.2)", opacity: 0 }], { duration: 750, fill: "forwards" });

let setN = 0;
function startSetFx(team, f) {
  const s = LAST;
  if (!s || !s.meta || !s.visible || !f || SetFX.running() || VolleyFX.running()) return;
  AceFX.stop(true); stopIntro();
  setN = f.n;
  SetFX.play($("fx"), {
    winner: team || f.winner, teams: s.meta.teams, setIndex: f.n,
    points: f.points, sets: f.sets, setsToWin: s.meta.rules?.setsToWin || 3

}

// ===========================================================
//  ACE
//  RMV : le chant ou la frappe, au hasard (jamais 3 fois de suite le même).
//  Adversaire : la pastille. Le compteur d'aces est dans l'état du match.
//    ?tempo=400   durée d'un temps du chant, en ms
// ===========================================================
const ACE_TEMPO = Math.max(250, Number(qs.get("tempo")) || 400);
const AceFX = (() => {
  const EASE = { out: "cubic-bezier(.16,1,.3,1)", back: "cubic-bezier(.34,1.56,.64,1)", in: "cubic-bezier(.7,0,.84,0)", slam: "cubic-bezier(.2,.9,.3,1)" };
  let cur = null;
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const rgb = (hex) => { const n = parseInt(String(hex).slice(1), 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const lum = (hex) => { const [r, g, b] = rgb(hex); return .299 * r + .587 * g + .114 * b; };
  const rel = (el, L) => { const a = el.getBoundingClientRect(), b = L.getBoundingClientRect(); return { x: a.left - b.left, y: a.top - b.top, w: a.width, h: a.height }; };
  const sk = (cls, text) => { const d = h("div", cls); d.append(h("span", "u", text)); return d; };
  const ord = (n) => (n === 1 ? "1er" : n + "e");

  function finish(c) {
    c.anims.forEach((a) => { try { a.cancel(); } catch (e) {} });
    c.timers.forEach(clearTimeout);
    c.layer.remove();
    if (cur === c) cur = null;
    c.done && c.done();
  }
  function stop(fast) {
    const c = cur; if (!c) return; cur = null;
    c.timers.forEach(clearTimeout);
    if (!fast) return finish(c);
    const a = c.layer.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: "forwards" });
    a.onfinish = () => finish(c);
  }
  function play(root, o) {
    stop();
    const t = o.team, T = o.teams[t];
    const color = T.color || (t === "A" ? "#D3121F" : "#555555");
    const m = { team: t, short: T.short || "", color, fg: lum(color) > 150 ? "#1A1416" : "#FFFFFF", count: o.count || 0 };
    const style = t === "A" ? (o.style || "chant") : "badge";   // l'adversaire : toujours la pastille
    const L = h("div", "afx");
    L.style.setProperty("--c", m.color); L.style.setProperty("--f", m.fg);
    root.append(L);
    const c = { layer: L, anims: [], timers: [] };
    cur = c;
    const A = (el, kf, x) => { const a = el.animate(kf, { fill: "both", easing: EASE.out, ...x }); c.anims.push(a); return a; };
    const rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const total = BUILD[style](L, m, A, o, c, rm);
    return new Promise((res) => { c.done = res; c.timers.push(setTimeout(() => { if (cur === c) { cur = null; finish(c); } }, total)); });
  }

  const BUILD = {
    /* Le chant : ACE ! ACE ! clap clap ×3, sur le tempo de la salle */
    chant(L, m, A, o, c, rm) {
      const T = Math.max(250, o.tempo || 400), start = 150;
      for (let k = 0; k < 3; k++) {
        const base = start + k * 4 * T, last = k === 2, big = last ? 1.18 : 1;
        // ACE ! (gauche) puis ACE ! (droite) : restent visibles pendant les claps du même tour
        [0, 1].forEach((i) => {
          const w = h("div", "ac-word" + (i ? " alt" : ""));
          w.style.left = i ? "70%" : "30%";
          w.append(sk("ac-blk", "ACE !"));
          L.append(w);
          const rot = i ? 4 : -5, life = (4 - i) * T;
          const tf = (s) => `translate(-50%,-50%) rotate(${rot}deg) scale(${s})`;
          A(w, [
            { transform: tf(1.9 * big), opacity: 0 },
            { offset: Math.min(.3, (T * .45) / life), transform: tf(big), opacity: 1 },
            { offset: .9, transform: tf(big), opacity: 1 },
            { transform: tf(big * .92), opacity: 0 }
          ], { duration: life + (last ? 500 : 0), delay: base + i * T, easing: "linear" });
        });
        // clap clap : onde en losange + étincelles, le score « tape » aussi
        [2, 3].forEach((j) => {
          const at = base + j * T;
          const b = h("div", "ac-burst"); L.append(b);
          [0, 1].forEach((r) => {
            const ring = h("div", "ac-ring"); b.append(ring);
            A(ring, [{ transform: "rotate(45deg) scale(.3)", opacity: 1 }, { transform: `rotate(45deg) scale(${r ? 3.4 : 2.2})`, opacity: 0 }], { duration: T * 1.2, delay: at + r * 60 });
          });
          if (!rm) for (let s = 0; s < 8; s++) {
            const sp = h("div", "ac-spark"); b.append(sp);
            const ang = s * 45 + (j === 3 ? 22.5 : 0);
            A(sp, [{ transform: `rotate(${ang}deg) translateY(-3cqh) scaleY(.4)`, opacity: 1 }, { transform: `rotate(${ang}deg) translateY(-13cqh) scaleY(1)`, opacity: 0 }], { duration: T * .9, delay: at });
          }
          const cl = h("div", "ac-clap", "CLAP"); L.append(cl);
          A(cl, [{ transform: "translate(-50%,0) scale(.6)", opacity: 0 }, { offset: .25, transform: "translate(-50%,0) scale(1.1)", opacity: 1 }, { transform: "translate(-50%,-2cqh) scale(1)", opacity: 0 }], { duration: T * .95, delay: at });
          if (o.bump && !rm) A(o.bump, [{ transform: "scale(1)" }, { transform: "scale(1.05)" }, { transform: "scale(1)" }], { duration: Math.min(260, T * .7), delay: at, fill: "none" });
        });
      }
      if (m.count) {                                            // dernier tour : le compte du match
        const ct = h("div", "ac-count", `${m.short} · ${ord(m.count)} ACE DU MATCH`); L.append(ct);
        A(ct, [{ transform: "translateX(-50%) translateY(3cqh)", opacity: 0 }, { transform: "translateX(-50%) translateY(0)", opacity: 1 }], { duration: 360, delay: start + 8 * T });
        A(ct, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, delay: start + 12 * T + 300, fill: "forwards" });
      }
      return start + 12 * T + 700;
    },

    /* La pastille : ACE au-dessus du score, avec le compte du match */
    badge(L, m, A, o) {
      const H = L.clientHeight, p = h("div", "ab");
      if (o.bug) {
        const b = rel(o.bug, L);
        p.style.right = (L.clientWidth - (b.x + b.w)) + "px";
        p.style.bottom = (H - b.y + H * .018) + "px";
      } else { p.style.right = "4cqw"; p.style.bottom = "30cqh"; }
      const top = sk("ab-top", "ACE");
      const sub = sk("ab-sub", m.count ? `${m.short} · ${ord(m.count)} ACE DU MATCH` : m.short);
      p.append(top, sub); L.append(p);
      A(top, [{ transform: "skewX(-12deg) translateX(10cqw) scale(.7)", opacity: 0 }, { transform: "skewX(-12deg) translateX(0) scale(1)", opacity: 1 }], { duration: 480, delay: 60, easing: EASE.back });
      A(sub, [{ transform: "skewX(-12deg) translateY(3cqh)", opacity: 0 }, { transform: "skewX(-12deg) translateY(0)", opacity: 1 }], { duration: 380, delay: 300 });
      A(p, [{ transform: "translateX(0)", opacity: 1 }, { transform: "translateX(6cqw)", opacity: 0 }], { duration: 300, delay: 2700, easing: EASE.in, fill: "forwards" });
      return 3100;
    },

    /* La frappe : le ballon s'écrase, A-C-E jaillit de l'impact */
    strike(L, m, A, o, c, rm) {
      const W = L.clientWidth, H = L.clientHeight, bs = H * .1;
      const ix = W * .5, iy = H * .7;                         // point d'impact
      const fly = 380, hit = 220 + fly;
      const ballSVG = '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#1A1416" stroke-width="5"/><g fill="none" stroke="#1A1416" stroke-width="5"><path d="M50 4 C64 30 61 62 30 91"/><path d="M4 41 C36 37 63 52 82 87"/><path d="M91 27 C66 35 44 57 41 96"/></g></svg>';
      const path = (dx) => [
        { transform: `translate(${W * 1.05 + dx}px,${-bs * 1.2}px) rotate(0deg)` },
        { transform: `translate(${ix - bs / 2}px,${iy - bs / 2}px) rotate(540deg)` }
      ];
      [3, 2, 1, 0].forEach((g) => {                          // 3 traînées + le ballon
        const b = h("div", "af-ball" + (g ? " af-ghost" : ""));
        b.innerHTML = ballSVG; L.append(b);
        const lag = g * 40;                                  // les traînées suivent le ballon
        A(b, path(0), { duration: fly, delay: 220 + lag, easing: EASE.in });
        if (g) A(b, [{ opacity: .4 - g * .1 }, { opacity: 0 }], { duration: 90, delay: hit + lag - 60, fill: "forwards" });
        if (!g) A(b, [
          { transform: `translate(${ix - bs / 2}px,${iy - bs / 2}px) rotate(540deg) scale(1)`, opacity: 1 },
          { transform: `translate(${ix - bs * 3}px,${iy - H * .45}px) rotate(720deg) scale(.6)`, opacity: 0 }
        ], { duration: 650, delay: hit, easing: EASE.out, fill: "forwards" });
      });
      // onde de choc au sol
      const burst = h("div", "af-burst"); burst.style.left = ix + "px"; burst.style.top = iy + "px"; L.append(burst);
      [0, 1].forEach((r) => {
        const ring = h("div", "ac-ring"); burst.append(ring);
        A(ring, [{ transform: "scaleY(.35) rotate(45deg) scale(.4)", opacity: 1 }, { transform: `scaleY(.35) rotate(45deg) scale(${r ? 5 : 3})`, opacity: 0 }], { duration: 700, delay: hit + r * 80 });
      });
      if (!rm) for (let s = 0; s < 10; s++) {
        const sp = h("div", "ac-spark"); burst.append(sp);
        const ang = -90 + (s - 4.5) * 17;
        A(sp, [{ transform: `rotate(${ang + 90}deg) translateY(-2cqh) scaleY(.4)`, opacity: 1 }, { transform: `rotate(${ang + 90}deg) translateY(-15cqh) scaleY(1)`, opacity: 0 }], { duration: 520, delay: hit });
      }
      if (!rm) A(L, [{ transform: "translate(0,0)" }, { transform: "translate(.6cqh,1cqh)" }, { transform: "translate(-.5cqh,-.6cqh)" }, { transform: "translate(0,0)" }], { duration: 260, delay: hit, easing: "linear", fill: "none" });
      // A-C-E jaillissent de l'impact
      const row = h("div", "af-letters"); L.append(row);
      const letters = ["A", "C", "E"].map((ch) => { const d = sk("af-l", ch); row.append(d); return d; });
      row.style.left = ix + "px"; row.style.top = (iy - H * .33) + "px";
      row.style.transform = "translateX(-50%)";
      letters.forEach((d, i) => {
        const dx = (i - 1) * 14;
        A(d, [
          { transform: `skewX(-12deg) translate(${-dx}cqh, 26cqh) scale(.2) rotate(${(i - 1) * 25}deg)`, opacity: 0 },
          { transform: "skewX(-12deg) translate(0,0) scale(1) rotate(0deg)", opacity: 1 }
        ], { duration: 520, delay: hit + 40 + i * 60, easing: EASE.back });
        A(d, [{ transform: "skewX(-12deg) translate(0,0)", opacity: 1 }, { transform: `skewX(-12deg) translate(0,-8cqh)`, opacity: 0 }], { duration: 300, delay: 2250 + i * 50, easing: EASE.in, fill: "forwards" });
      });
      const tm = h("div", "af-team", m.count ? `${m.short} · ${ord(m.count)} ACE DU MATCH` : m.short); L.append(tm);
      tm.style.left = ix + "px"; tm.style.top = (iy - H * .07) + "px";
      A(tm, [{ transform: "translateX(-50%) translateY(2cqh)", opacity: 0 }, { transform: "translateX(-50%) translateY(0)", opacity: 1 }], { duration: 360, delay: hit + 300 });
      A(tm, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, delay: 2300, fill: "forwards" });
      return 2750;
    }
  };

  return { play, stop, running: () => !!cur };
})();

let aceRun = null, aceStyles = [];
function pickAceStyle() {
  let s = Math.random() < .5 ? "chant" : "strike";
  const n = aceStyles.length;
  if (n >= 2 && aceStyles[n - 1] === s && aceStyles[n - 2] === s) s = s === "chant" ? "strike" : "chant";
  aceStyles = [...aceStyles, s].slice(-4);
  return s;
}
function startAce(team, count) {
  const s = LAST;
  if (!s || !s.meta || !s.visible || (team !== "A" && team !== "B")) return;
  if (VolleyFX.running() || SetFX.running()) return;     // fin de set / de match prioritaire
  const n = count || s.aces[team] || 0;
  aceRun = { team, n };
  AceFX.play($("fx"), {
    style: team === "A" ? pickAceStyle() : "badge", team, teams: s.meta.teams,
    tempo: ACE_TEMPO, count: n, bug: $("bug"), bump: document.querySelector(".plate")
  }).then(() => { aceRun = null; });
}
window.addEventListener("volley:event", (e) => {
  const ev = e.detail || {};
  if (ev.type === "ace") setTimeout(() => startAce(ev.team, ev.count), 150);
});

// ===========================================================
//  HORLOGE — heure locale du téléphone, coin bas opposé au score
// ===========================================================
const CLOCK_ON = qs.get("clock") !== "0";
(() => {
  const c = $("clock");
  if (pos[0] === "b" && pos[1] === "l") { c.style.left = "auto"; c.style.right = "4vw"; }   // score en bas à gauche → horloge à droite
  let last = "";
  const tick = () => {
    const d = new Date();
    const txt = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    if (txt !== last) { last = txt; $("clockTxt").textContent = txt; }
  };
  tick(); setInterval(tick, 1000);
})();
function updateClock(s) {
  const show = CLOCK_ON && (!s || s.visible !== false);
  $("clock").classList.toggle("hidden", !show);
}

// ===========================================================
//  ÉCHAUFFEMENT — cartes joueurs, quelques-unes à la fois, en fondu
//  Allumé / éteint depuis l'appli (Événements → Échauffement),
//  retiré automatiquement au premier point.
//  Joueurs : config.js (roster) ; présents : menu "Joueurs présents" de l'appli.
// ===========================================================
const SILHOUETTE = '<svg viewBox="0 0 100 110" aria-hidden="true"><g fill="#A8A0A3" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"><path d="M12 112 C12 77 28 63 50 63 C72 63 88 77 88 112 Z"/><circle cx="50" cy="33" r="21"/></g></svg>';
const WU_PAGE_MS = Math.max(3, Number(qs.get("rotation")) || 7) * 1000;
let wuOn = false, wuSig = "", wuTimer = null, wuPage = 0, PRESENT = null;

function presentRoster() {
  const all = (window.SCORE_CONFIG?.roster || []).filter(Boolean);
  return PRESENT ? all.filter((p) => PRESENT.has(String(p.number))) : all;
}

function playerCard(p) {
  const c = el("div", "pc");
  const fig = el("div", "pc-fig");
  if (p.photo) {
    const img = new Image(); img.src = p.photo; img.alt = "";
    img.onerror = () => { fig.innerHTML = SILHOUETTE; };
    fig.append(img);
  } else fig.innerHTML = SILHOUETTE;
  const plate = el("div", "pc-plate");
  const num = String(p.number ?? "");
  plate.style.setProperty("--nd", Math.max(1, num.length));
  const band = el("div", "pc-band"); band.append(el("span", null, p.name || ""));
  plate.append(band, el("div", "pc-num", num));
  c.append(fig, plate);
  const info = el("div", "pc-info");
  if (p.position)  { const d = el("div", "pc-pos");  d.append(el("span", null, p.position)); info.append(d); }
  if (p.punchline) { const d = el("div", "pc-line"); d.append(el("span", null, `« ${p.punchline} »`)); info.append(d); }
  c.append(info);
  return c;
}

// Noms longs : le nom commence après le numéro et rapetisse jusqu'à tenir dans le losange
function fitCards(box) {
  const em = parseFloat(getComputedStyle(box).fontSize) || innerHeight / 100;
  box.querySelectorAll(".pc-band").forEach((b) => {
    const sp = b.firstChild, num = b.parentNode.querySelector(".pc-num");
    if (num && num.textContent) b.style.paddingLeft = Math.round(num.offsetLeft + num.offsetWidth + em * 1.4) + "px";
    for (const fs of ["3.3em", "2.9em", "2.5em", "2.2em"]) {
      b.style.setProperty("--nf", fs);
      if (sp.scrollWidth <= sp.clientWidth + 1) break;
    }
  });
  // même taille de nom pour toutes les cartes affichées ensemble (la plus petite)
  const bands = [...box.querySelectorAll(".pc-band")];
  const min = Math.min(...bands.map((b) => parseFloat(b.style.getPropertyValue("--nf")) || 3.3));
  bands.forEach((b) => b.style.setProperty("--nf", min + "em"));
}

function perPage() {
  const em = parseFloat(getComputedStyle($("wu")).fontSize) || innerHeight / 100;
  const area = $("wuCards").clientWidth, card = 31 * em, gap = 2.6 * em;
  return Math.max(1, Math.floor((area + gap) / (card + gap)));
}

// L'horloge se pose juste au-dessus du bloc ÉCHAUFFEMENT
function placeClock() {
  const c = $("clock");
  const corner = [...$("bl").children].some((x) => !x.hidden);
  const anchor = wuOn ? $("wuHead") : corner && !$("bl").classList.contains("right") ? $("bl") : null;
  if (!anchor) { c.style.bottom = ""; return; }
  const r = anchor.getBoundingClientRect();
  c.style.bottom = Math.round(innerHeight - r.top + innerHeight * .016) + "px";
}

function showPage() {
  clearTimeout(wuTimer);
  const list = presentRoster(), box = $("wuCards");
  if (!list.length) { box.replaceChildren(); return; }
  const n = perPage(), pages = Math.ceil(list.length / n);
  if (wuPage >= pages) wuPage = 0;
  box.replaceChildren(...list.slice(wuPage * n, wuPage * n + n).map(playerCard));
  fitCards(box);
  [...box.children].forEach((c, i) => c.animate(
    [{ opacity: 0, transform: "translateY(1.6em)" }, { opacity: 1, transform: "translateY(0)" }],
    { duration: 600, delay: i * 120, easing: "cubic-bezier(.16,1,.3,1)", fill: "backwards" }));
  if (pages < 2) return;                               // tout le monde tient : pas de rotation
  wuTimer = setTimeout(() => {
    const kids = [...box.children];
    kids.forEach((c, i) => c.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, delay: i * 80, fill: "forwards" }));
    wuTimer = setTimeout(() => { wuPage = (wuPage + 1) % pages; if (wuOn) showPage(); }, 450 + kids.length * 80);
  }, WU_PAGE_MS);
}

function updateWarmup(s) {
  const on = !!(s && s.meta && s.visible !== false && s.warmup && s.phase === "playing");
  if (on) {
    const T = s.meta.teams;
    const a = T.A.name || T.A.short || "", b = T.B.name || T.B.short || "";
    $("wuA").textContent = a; $("wuB").textContent = b;
    const len = Math.max(a.length, b.length + 3);
    $("wu").style.setProperty("--wu-fs", len > 22 ? "2.8em" : len > 15 ? "3.4em" : "4em");
    const sig = JSON.stringify([window.SCORE_CONFIG?.roster || [], PRESENT ? [...PRESENT] : null]);
    if (!wuOn || sig !== wuSig) { wuSig = sig; wuPage = 0; requestAnimationFrame(() => { if (wuOn) showPage(); }); }
  }
  if (on !== wuOn) {
    wuOn = on;
    $("wu").classList.toggle("show", on);
    $("bug").classList.toggle("wu-hide", on);            // 0-0 inutile pendant l'échauffement
    if (!on) clearTimeout(wuTimer);
  }
  requestAnimationFrame(placeClock);
  setTimeout(placeClock, 800);                         // après l'entrée du bandeau
}
function setPresent(val) {                             // { n7: true, ... } ou null (= tout le monde)
  PRESENT = val ? new Set(Object.keys(val).filter((k) => val[k]).map((k) => k.replace(/^n/, ""))) : null;
  if (LAST) updateWarmup(LAST);
}
addEventListener("resize", () => { if (wuOn) { showPage(); placeClock(); } });

// ===========================================================
//  INTER-SET et TEMPS MORT — bandeaux du coin, allumés / éteints
//  depuis l'appli, retirés automatiquement au point suivant.
// ===========================================================
if (pos[0] === "b" && pos[1] === "l") $("bl").classList.add("right");   // score en bas à gauche → bandeaux à droite
const TO_SECONDS = 30;
let isSig = "", toSig = "", toTick = null;

function sk(cls, ...kids) { const d = el("div", cls + " sk"); const u = el("span", "u"); u.append(...kids); d.append(u); return d; }
function showPanel(node, on) {
  if (on === !node.hidden) return;
  if (on) {
    node.hidden = false;
    node.animate([{ opacity: 0, transform: "translateX(-6em)" }, { opacity: 1, transform: "none" }], { duration: 550, easing: "cubic-bezier(.16,1,.3,1)" });
  } else {
    const a = node.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(2em)" }], { duration: 300, fill: "forwards" });
    a.onfinish = () => { node.hidden = true; a.cancel(); placeClock(); };
  }
}

function updateBanners(s) {
  const ok = !!(s && s.meta && s.visible !== false);
  // ---- Inter-set
  const isOn = ok && !!s.interSet;
  if (isOn) {
    const f = s.phase === "setEnd" ? finishedSet(s) : null;
    const sets = f ? f.sets : s.sets, hist = f ? f.history : s.history;
    const next = f ? f.n + 1 : s.setIndex;
    const T = s.meta.teams, R = s.meta.rules || {};
    const tie = next === 2 * (R.setsToWin || 3) - 1;
    const sig = JSON.stringify([sets, hist, next, s.aces, T.A.short, T.B.short]);
    if (sig !== isSig) {
      isSig = sig;
      const main = el("span", null); main.style.display = "contents";
      const tabs = el("div", "is-tabs");
      hist.forEach((h) => {
        const u = [el("span", h.winner === "A" ? "w" : "l", h.A), el("span", "l", " - "), el("span", h.winner === "B" ? "w" : "l", h.B)];
        tabs.append(sk("is-tab", ...u));
      });
      if (s.aces && (s.aces.A || s.aces.B)) tabs.append(sk("is-tab dark", `ACES ${s.aces.A} – ${s.aces.B}`));
      $("is").replaceChildren(
        sk("is-k", el("i", "dot"), `PAUSE · PROCHAIN : ${tie ? "TIE-BREAK" : "SET " + next}`),
        sk("is-main", el("span", "t", T.A.short || ""), el("span", null, sets.A), el("span", "d", "–"), el("span", null, sets.B), el("span", "t", T.B.short || "")),
        tabs
      );
    }
  }
  // ---- Temps mort
  const t = ok && (s.timeout === "A" || s.timeout === "B") ? s.timeout : null;
  if (t) {
    const team = s.meta.teams[t];
    const sig = `${t}|${s.timeoutAt || 0}|${team.name}`;
    if (sig !== toSig) {
      toSig = sig;
      const color = team.color || (t === "A" ? "#D3121F" : "#555555");
      const n = parseInt(String(color).slice(1), 16) || 0;
      const fg = (.299 * (n >> 16 & 255) + .587 * (n >> 8 & 255) + .114 * (n & 255)) > 150 ? "#1A1416" : "#FFFFFF";
      const name = team.name || team.short || "";
      const secEl = el("span", "to-sec"), bar = el("div", "to-bar"), fill = el("i");
      bar.append(fill);
      const row = el("div", "to-row"); row.append(el("span", "to-k", "TEMPS MORT"), secEl);
      const nm = el("span", "to-name", name);
      nm.style.setProperty("--to-fs", name.length > 22 ? "3.2em" : name.length > 15 ? "3.8em" : "4.6em");
      const main = sk("to-main", row, nm, bar);
      main.style.setProperty("--c", color); main.style.setProperty("--f", fg);
      $("to").replaceChildren(main);
      // compte à rebours de 30 s (calé sur l'heure de l'appui dans l'appli)
      const start = Math.min(Date.now(), s.timeoutAt || Date.now());
      clearInterval(toTick);
      const tick = () => {
        const left = Math.max(0, TO_SECONDS - (Date.now() - start) / 1000);
        secEl.textContent = left > 0 ? Math.ceil(left) + " s" : "";
        fill.style.transform = `scaleX(${left / TO_SECONDS})`;
        if (left <= 0) clearInterval(toTick);
      };
      tick(); toTick = setInterval(tick, 250);
    }
  } else { clearInterval(toTick); toSig = ""; }

  showPanel($("is"), isOn);
  showPanel($("to"), !!t);
  requestAnimationFrame(placeClock);
  setTimeout(placeClock, 650);
}

// ===========================================================
//  PRÉSENTATION DES ÉQUIPES — toute la compo à l'écran, joueur par joueur
// ===========================================================
const TI_MS = Math.max(5, Number(qs.get("compo")) || 20) * 1000;
const POS_ORDER = ["pass", "point", "récep", "recep", "centr", "lib"];
let tiTimer = null, tiAnim = null;
const posRank = (p) => { const s = String(p.position || "").toLowerCase(); const i = POS_ORDER.findIndex((k) => s.startsWith(k)); return i < 0 ? 9 : i; };

function stopIntro() {
  clearTimeout(tiTimer); tiTimer = null;
  if ($("ti").hidden) return;
  tiAnim = $("ti").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, fill: "forwards" });
  tiAnim.onfinish = () => {
    $("ti").hidden = true; tiAnim.cancel(); tiAnim = null;
    $("bug").classList.remove("ti-hide"); $("clock").classList.remove("ti-hide");
  };
}
function startIntro() {
  const s = LAST;
  if (!s || !s.meta || s.visible === false) return;
  if (VolleyFX.running() || SetFX.running()) return;
  clearTimeout(tiTimer); tiAnim && tiAnim.cancel();
  const T = s.meta.teams;
  const players = presentRoster().slice().sort((a, b) => posRank(a) - posRank(b) || (a.number || 0) - (b.number || 0));

  // En-tête : écusson, nom du club, adversaire
  const crest = el("div", "ti-crest");
  const logo = window.SCORE_CONFIG?.home?.logo || T.A.logo;
  if (logo) { const i = new Image(); i.src = logo; i.alt = ""; i.onerror = () => i.remove(); crest.append(i); }
  const ttl = el("div", "ti-ttl");
  ttl.append(el("div", "ti-k", "LA COMPO DU JOUR"), el("div", "ti-name", T.A.name || T.A.short || ""), el("div", "ti-vs", `vs ${T.B.name || T.B.short || ""}`));
  $("tiHead").replaceChildren(crest, ttl);

  // Joueurs sur une ou deux lignes
  const grid = $("tiGrid");
  const perRow = players.length > 6 ? Math.ceil(players.length / 2) : players.length;
  const rows = [];
  for (let i = 0; i < players.length; i += perRow) rows.push(players.slice(i, i + perRow));
  grid.replaceChildren(...rows.map((r) => { const row = el("div", "ti-row"); row.append(...r.map(playerCard)); return row; }));

  $("ti").hidden = false;
  $("bug").classList.add("ti-hide"); $("clock").classList.add("ti-hide");
  fitCards(grid);
  const E = "cubic-bezier(.16,1,.3,1)";
  $("ti").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500 });
  $("tiHead").animate([{ opacity: 0, transform: "translateY(-3em)" }, { opacity: 1, transform: "none" }], { duration: 700, delay: 200, easing: E, fill: "backwards" });
  grid.querySelectorAll(".pc").forEach((c, i) => c.animate(
    [{ opacity: 0, transform: "translateY(2.5em) scale(.94)" }, { opacity: 1, transform: "none" }],
    { duration: 650, delay: 800 + i * 320, easing: E, fill: "backwards" }));
  tiTimer = setTimeout(stopIntro, TI_MS);
}

window.addEventListener("volley:event", (e) => {
  if ((e.detail || {}).type === "teamIntro") startIntro();
});

// ===========================================================
//  Canal d'événements — branché, pas encore exploité.
//    window.addEventListener("volley:event", (e) => console.log(e.detail))
// ===========================================================
function onVolleyEvent(ev) {
  window.dispatchEvent(new CustomEvent("volley:event", { detail: ev }));
  if (DEBUG) console.log("[event]", ev);
}

// ===========================================================
//  Cache local : réaffiche le dernier état connu au rechargement
// ===========================================================
const CACHE_KEY = `volley-display-${M || "demo"}`;
function saveCache(s) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(s)); } catch {} }
function loadCache()  { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch { return null; } }

// ===========================================================
//  Mode démo : un match complet en accéléré (sans Firebase)
// ===========================================================
if (DEMO) {
  const CFG = window.SCORE_CONFIG || {};
  const rules = CFG.rules || { setsToWin: 3, pointsPerSet: 25, pointsTieBreak: 15, minLead: 2, timeoutsPerSet: 2 };
  const s = norm({
    meta: {
      rules,
      teams: {
        A: CFG.home || { name: "Ramonville", short: "RMV", color: "#D3121F" },
        B: CFG.awayDefault || { short: "ADV", color: "#1E5AA8" }
      }
    },
    phase: "playing", setIndex: 3, serving: "A",
    score: { A: 18, B: 16 }, sets: { A: 1, B: 1 },
    history: [{ A: 25, B: 21, winner: "A" }, { A: 23, B: 25, winner: "B" }],
    visible: true, swapped: false
  });
  const SCENE = qs.get("scene");
  if (SCENE === "warmup") {                          // aperçus
    Object.assign(s, { warmup: true, setIndex: 1, score: { A: 0, B: 0 }, sets: { A: 0, B: 0 }, history: [] });
  } else if (SCENE === "interset") {
    Object.assign(s, { interSet: true, score: { A: 0, B: 0 }, aces: { A: 3, B: 1 } });
  } else if (SCENE === "timeout") {
    Object.assign(s, { timeout: "B", timeoutAt: Date.now() });
  } else if (SCENE === "intro") {
    s.paused = true;
    setTimeout(() => onVolleyEvent({ type: "teamIntro" }), 700);
  }
  render(s);
  setInterval(() => {
    if (s.warmup || s.interSet || s.timeout || s.paused) return;
    if (s.phase === "matchEnd") return;
    if (s.phase === "setEnd") {                       // pause entre les sets (~6 s)
      if (++s.pause > 5) { s.pause = 0; s.phase = "playing"; s.setIndex++; s.score = { A: 0, B: 0 }; render(s); }
      return;
    }
    const t = Math.random() < .55 ? "A" : "B";
    s.score[t]++;
    if (s.serving === t && Math.random() < .12) { s.aces[t]++; onVolleyEvent({ type: "ace", team: t, count: s.aces[t] }); }
    s.serving = t;
    const target = s.setIndex === 2 * rules.setsToWin - 1 ? rules.pointsTieBreak : rules.pointsPerSet;
    if (s.score[t] >= target && s.score[t] - s.score[other(t)] >= rules.minLead) {
      s.history.push({ A: s.score.A, B: s.score.B, winner: t });
      s.sets[t]++;
      if (s.sets[t] >= rules.setsToWin) { s.phase = "matchEnd"; s.winner = t; onVolleyEvent({ type: "matchEnd", team: t }); }
      else { s.phase = "setEnd"; s.pause = 0; onVolleyEvent({ type: "setEnd", team: t }); }
    }
    render(s);
  }, 1200);
} else {
  startLive();
}

// ===========================================================
//  Mode live (Firebase, lecture seule, sans compte)
// ===========================================================
async function startLive() {
  const CFG = window.SCORE_CONFIG;
  if (!M || !CFG?.firebase) { dbg("Paramètre m ou config.js manquant"); return; }

  const cached = loadCache();
  if (cached) render(norm(cached));

  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getDatabase, ref, onValue, onChildAdded, query, limitToLast } =
    await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");

  const app = initializeApp(CFG.firebase);
  const db  = getDatabase(app);

  onValue(ref(db, ".info/connected"), (snap) => dbg(snap.val() ? "connecté" : "hors ligne"));

  onValue(ref(db, `matches/${M}/core/state`), (snap) => {
    if (!snap.exists()) { render(null); return; }
    const s = norm(snap.val());
    saveCache(s);
    render(s);
  }, (err) => dbg("Lecture refusée : " + err.code));

  onValue(ref(db, `matches/${M}/present`), (snap) => setPresent(snap.val()), () => {});

  const evQuery = query(ref(db, `matches/${M}/events`), limitToLast(1));
  let ready = false;
  onChildAdded(evQuery, (snap) => { if (ready) onVolleyEvent(snap.val()); });
  onValue(evQuery, () => { ready = true; }, { onlyOnce: true });
}
</script>
