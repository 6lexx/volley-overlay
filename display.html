<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     THÈME — tout le visuel se règle ici.
     Tailles en vh : elles suivent la hauteur de l'image.
     ========================================================= */
  :root {
    /* Couleurs du club */
    --red:       #D3121F;   /* plaque principale */
    --red-deep:  #8E0A13;
    --white:     #FFFFFF;
    --ink:       #1A1416;   /* texte sombre, losange "set en cours" */
    --loser:     #8A8085;   /* score perdant dans l'historique */

    /* Typo */
    --num:   "Big Shoulders Display", "Arial Narrow", sans-serif;
    --small: "Barlow Condensed", "Arial Narrow", sans-serif;

    /* Placement (aussi via ?pos=br|bl|tr|tl) — défaut : bas droite */
    --top:    auto;
    --bottom: 6vh;
    --left:   auto;
    --right:  4vw;
    --align:  flex-end;

    /* Taille globale (aussi via ?scale=1.2) */
    --scale: 1;

    /* Inclinaison des losanges */
    --skew: -12deg;

    /* Dimensions dérivées */
    --score-size: calc(10vh  * var(--scale));
    --name-size:  calc(3.8vh * var(--scale));
    --tab-size:   calc(2.8vh * var(--scale));
    --dia-size:   calc(1.9vh * var(--scale));
    --ball-size:  calc(3.3vh * var(--scale));

    /* Animations */
    --anim: .22s;
    --fade: .35s;
  }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: transparent !important;
    overflow: hidden;
  }

  .bug {
    position: fixed;
    top: var(--top); bottom: var(--bottom); left: var(--left); right: var(--right);
    display: flex; flex-direction: column; align-items: var(--align);
    gap: calc(.9vh * var(--scale));
    transition: opacity var(--fade) ease, transform var(--fade) ease;
  }
  .bug.hidden { opacity: 0; transform: translateY(2vh); }
  .bug.top { flex-direction: column-reverse; }   /* en haut : losanges sous la plaque */

  /* Tout ce qui est incliné : le parent penche, le contenu se redresse */
  .skew   { transform: skewX(var(--skew)); }
  .unskew { transform: skewX(calc(var(--skew) * -1)); display: inline-flex; align-items: center; }

  /* ---------- Losanges d'info : scores des sets + set en cours ---------- */
  .tabs { display: flex; gap: calc(.8vh * var(--scale)); }
  .tab {
    background: var(--white); color: var(--ink);
    font: 700 var(--tab-size)/1 var(--small);
    padding: calc(.9vh * var(--scale)) calc(1.5vh * var(--scale));
    box-shadow: 0 .4vh 1vh rgba(0, 0, 0, .3);
    font-variant-numeric: tabular-nums;
  }
  .tab .w { color: var(--red); }
  .tab .l { color: var(--loser); }
  .tab .dash { color: var(--loser); margin: 0 .25em; }
  .tab.now  { background: var(--ink); color: var(--white); }
  .tab.win  { background: var(--red); color: var(--white); }
  .tab.enter { animation: tabIn .45s cubic-bezier(.2, .9, .3, 1.2); }
  @keyframes tabIn {
    from { opacity: 0; transform: skewX(var(--skew)) translateX(3vh); }
    to   { opacity: 1; transform: skewX(var(--skew)) translateX(0); }
  }

  /* ---------- Plaque rouge : noms, sets, scores ---------- */
  .slab {
    display: flex; align-items: center;
    background: var(--red);
    padding: calc(.8vh * var(--scale)) calc(2.6vh * var(--scale));
    box-shadow: 0 .6vh 1.6vh rgba(0, 0, 0, .35);
  }
  .slab > .unskew { gap: calc(1.6vh * var(--scale)); }

  .side { display: flex; flex-direction: column; align-items: center; gap: calc(.7vh * var(--scale)); }
  .tn {
    display: flex; align-items: center; gap: calc(.6vh * var(--scale));
    font: 800 var(--name-size)/1 var(--num); color: var(--white);
    letter-spacing: .04em; white-space: nowrap;
  }
  .tlabel { border-bottom: calc(.4vh * var(--scale)) solid var(--mark, transparent); padding-bottom: .1vh; }

  .ball {
    width: var(--ball-size); height: var(--ball-size);
    opacity: 0; transform: scale(.3) rotate(-90deg);
    transition: opacity var(--anim), transform .35s cubic-bezier(.2, .9, .3, 1.3);
  }
  .side.serving .ball { opacity: 1; transform: scale(1) rotate(0); }

  /* Sets : losanges vides qui se remplissent */
  .dia { display: flex; gap: calc(.9vh * var(--scale)); }
  .dia i {
    width: var(--dia-size); height: var(--dia-size);
    border: calc(.3vh * var(--scale)) solid var(--white); box-sizing: border-box;
    transform: rotate(45deg);
    background: transparent;
    transition: background .4s ease;
  }
  .dia i.on { background: var(--white); }

  .n {
    font: 900 var(--score-size)/1 var(--num); color: var(--white);
    font-variant-numeric: tabular-nums; width: 1.15em; text-align: center;
  }
  .n.bump { animation: bump var(--anim) ease-out; }
  @keyframes bump { 45% { transform: scale(1.18); } }

  .sep { width: calc(.6vh * var(--scale)); height: calc(7vh * var(--scale)); background: var(--white); opacity: .9; }

  .debug {
    position: fixed; left: 1vh; top: 1vh;
    font: 600 2vh system-ui, sans-serif; color: #fff;
    background: rgba(0, 0, 0, .6); padding: .5vh 1vh; border-radius: .6vh;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- Ballon (indicateur de service) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ball" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10.5" fill="#fff" stroke="#8E0A13" stroke-width="1.6"/>
    <path d="M12 1.5c-2 4-2 9 1 13M3 8c4 0 9 1 12 5M5 19c3-3 8-5 13-4" fill="none" stroke="#D3121F" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="bug hidden" id="bug">
  <div class="tabs" id="tabs"></div>

  <div class="slab skew">
    <div class="unskew">
      <div class="side" data-pos="0">
        <div class="tn"><svg class="ball"><use href="#ball"/></svg><span class="tlabel"></span></div>
        <div class="dia"></div>
      </div>
      <span class="n" data-pos="0"></span>
      <span class="sep"></span>
      <span class="n" data-pos="1"></span>
      <div class="side" data-pos="1">
        <div class="tn"><span class="tlabel"></span><svg class="ball"><use href="#ball"/></svg></div>
        <div class="dia"></div>
      </div>
    </div>
  </div>
</div>

<div class="debug" id="debug" hidden></div>

<script src="config.js"></script>
<script type="module">
// ===========================================================
//  Paramètres d'URL
//    m=volley-silex    identifiant du match (obligatoire hors démo)
//    pos=br|bl|tr|tl   coin d'ancrage (défaut : br, bas droite)
//    scale=1.2         taille globale
//    demo=1            faux match animé, sans Firebase (pour le design)
//    debug=1           affiche l'état de connexion (pas en live)
// ===========================================================
const qs    = new URLSearchParams(location.search);
const M     = qs.get("m");
const DEMO  = qs.get("demo") === "1";
const DEBUG = qs.get("debug") === "1";

const rootStyle = document.documentElement.style;
const pos = qs.get("pos") || "br";
if (pos[0] === "t") {
  rootStyle.setProperty("--top", "4.5vh"); rootStyle.setProperty("--bottom", "auto");
  document.getElementById("bug").classList.add("top");
}
if (pos[1] === "l") {
  rootStyle.setProperty("--left", "4vw"); rootStyle.setProperty("--right", "auto");
  rootStyle.setProperty("--align", "flex-start");
}
if (qs.get("scale")) rootStyle.setProperty("--scale", qs.get("scale"));

const $ = (id) => document.getElementById(id);
const dbg = (msg) => { if (DEBUG) { $("debug").hidden = false; $("debug").textContent = msg; } };

// ===========================================================
//  Rendu
// ===========================================================
const other = (t) => (t === "A" ? "B" : "A");
const toArr = (x) => (Array.isArray(x) ? x.filter(Boolean) : x ? Object.values(x) : []);

function norm(s) {
  s.score    = s.score    ?? { A: 0, B: 0 };
  s.sets     = s.sets     ?? { A: 0, B: 0 };
  s.timeouts = s.timeouts ?? { A: 0, B: 0 };
  for (const k of ["score", "sets", "timeouts"]) { s[k].A ??= 0; s[k].B ??= 0; }
  s.history = toArr(s.history);
  s.visible = s.visible !== false;
  return s;
}

function setNum(el, value) {
  const v = String(value);
  if (el.textContent === v) return;
  const first = el.textContent === "";
  el.textContent = v;
  if (!first) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

let shownSets = -1;   // nombre de sets déjà affichés (pour animer le nouveau)

function render(s) {
  if (!s || !s.meta) { $("bug").classList.add("hidden"); return; }
  const teams = s.meta.teams;
  const R = s.meta.rules;
  const order = s.swapped ? ["B", "A"] : ["A", "B"];

  // --- Plaque : noms, ballon de service, losanges de sets, scores
  document.querySelectorAll(".side").forEach((side) => {
    const t = order[Number(side.dataset.pos)];
    side.querySelector(".tlabel").textContent = teams[t].short;
    // Repère de couleur sous le nom de l'adversaire (l'équipe A est déjà en rouge)
    side.style.setProperty("--mark", t === "B" ? teams.B.color : "transparent");
    side.classList.toggle("serving", s.phase === "playing" && s.serving === t);

    const dia = side.querySelector(".dia");
    if (dia.children.length !== R.setsToWin) {
      dia.replaceChildren(...Array.from({ length: R.setsToWin }, () => el("i")));
    }
    // Losanges remplis depuis le score : côté gauche vers l'extérieur, côté droit aussi
    const kids = [...dia.children];
    if (side.dataset.pos === "0") kids.reverse();
    kids.forEach((d, i) => d.classList.toggle("on", i < s.sets[t]));
  });
  document.querySelectorAll(".n").forEach((n) => setNum(n, s.score[order[Number(n.dataset.pos)]]));

  // --- Losanges d'info : score de chaque set terminé + set en cours
  const tabs = $("tabs");
  tabs.replaceChildren();
  s.history.forEach((h, i) => {
    const tab = el("div", "tab skew");
    const inner = el("span", "unskew");
    const [a, b] = order;
    inner.append(
      el("span", h.winner === a ? "w" : "l", h[a]),
      el("span", "dash", "-"),
      el("span", h.winner === b ? "w" : "l", h[b])
    );
    tab.appendChild(inner);
    if (shownSets >= 0 && i >= shownSets) tab.classList.add("enter");
    tabs.appendChild(tab);
  });
  shownSets = s.history.length;

  const tieBreak = s.setIndex === 2 * R.setsToWin - 1;
  let label, cls = "now";
  if (s.phase === "matchEnd")    { label = `Victoire ${teams[s.winner].short}`; cls = "win"; }
  else if (s.phase === "setEnd") label = `Fin du set ${s.setIndex}`;
  else                           label = tieBreak ? "Tie-break" : `Set ${s.setIndex}`;
  const now = el("div", `tab skew ${cls}`);
  now.appendChild(el("span", "unskew", label));
  tabs.appendChild(now);

  $("bug").classList.toggle("hidden", !s.visible);
}

// ===========================================================
//  Canal d'événements — branché, pas encore exploité.
//    window.addEventListener("volley:event", (e) => console.log(e.detail))
// ===========================================================
function onVolleyEvent(ev) {
  window.dispatchEvent(new CustomEvent("volley:event", { detail: ev }));
  if (DEBUG) console.log("[event]", ev);
}

// ===========================================================
//  Cache local : réaffiche le dernier état connu au rechargement
// ===========================================================
const CACHE_KEY = `volley-display-${M || "demo"}`;
function saveCache(s) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(s)); } catch {} }
function loadCache()  { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch { return null; } }

// ===========================================================
//  Mode démo : un match complet en accéléré (sans Firebase)
// ===========================================================
if (DEMO) {
  const CFG = window.SCORE_CONFIG || {};
  const rules = CFG.rules || { setsToWin: 3, pointsPerSet: 25, pointsTieBreak: 15, minLead: 2, timeoutsPerSet: 2 };
  const s = norm({
    meta: {
      rules,
      teams: {
        A: CFG.home || { short: "RAM", color: "#D3121F" },
        B: CFG.awayDefault || { short: "ADV", color: "#1E5AA8" }
      }
    },
    phase: "playing", setIndex: 3, serving: "A",
    score: { A: 18, B: 16 }, sets: { A: 1, B: 1 },
    history: [{ A: 25, B: 21, winner: "A" }, { A: 23, B: 25, winner: "B" }],
    visible: true, swapped: false
  });
  render(s);
  setInterval(() => {
    if (s.phase === "matchEnd") return;
    const t = Math.random() < .55 ? "A" : "B";
    s.score[t]++; s.serving = t;
    const target = s.setIndex === 2 * rules.setsToWin - 1 ? rules.pointsTieBreak : rules.pointsPerSet;
    if (s.score[t] >= target && s.score[t] - s.score[other(t)] >= rules.minLead) {
      s.history.push({ A: s.score.A, B: s.score.B, winner: t });
      s.sets[t]++;
      if (s.sets[t] >= rules.setsToWin) { s.phase = "matchEnd"; s.winner = t; }
      else { s.setIndex++; s.score = { A: 0, B: 0 }; }
    }
    render(s);
  }, 1200);
} else {
  startLive();
}

// ===========================================================
//  Mode live (Firebase, lecture seule, sans compte)
// ===========================================================
async function startLive() {
  const CFG = window.SCORE_CONFIG;
  if (!M || !CFG?.firebase) { dbg("Paramètre m ou config.js manquant"); return; }

  const cached = loadCache();
  if (cached) render(norm(cached));

  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getDatabase, ref, onValue, onChildAdded, query, limitToLast } =
    await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");

  const app = initializeApp(CFG.firebase);
  const db  = getDatabase(app);

  onValue(ref(db, ".info/connected"), (snap) => dbg(snap.val() ? "connecté" : "hors ligne"));

  onValue(ref(db, `matches/${M}/core/state`), (snap) => {
    if (!snap.exists()) { render(null); return; }
    const s = norm(snap.val());
    saveCache(s);
    render(s);
  }, (err) => dbg("Lecture refusée : " + err.code));

  const evQuery = query(ref(db, `matches/${M}/events`), limitToLast(1));
  let ready = false;
  onChildAdded(evQuery, (snap) => { if (ready) onVolleyEvent(snap.val()); });
  onValue(evQuery, () => { ready = true; }, { onlyOnce: true });
}
</script>
</body>
</html>
