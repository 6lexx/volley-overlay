<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Scène · Tournoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css">
<link rel="stylesheet" href="shared/ecrans.css">
</head>
<!--
  Une seule scène, fixée par l'URL : scene.html?vue=poules|arbre|pause|intermatch|neutre
  Le plus simple reste overlay.html, où tout se pilote depuis pilotage.html.
-->
<body class="transparent">
<div class="scene" id="scene"><div class="ecran" id="ecran"></div></div>

<script src="config.js"></script>
<script src="shared/qrcode.js"></script>
<script type="module">
import { CFG, $, param, monterScene, surSignalRecharge } from "./shared/outils.js";
import { connecter } from "./shared/firebase.js";
import { htmlEcran } from "./shared/ecrans.js";
import * as T from "./shared/moteur.js";

monterScene($("#scene"));
const vue = param("vue") || "poules";
if (param("apercu") === "1") document.body.classList.add("apercu");
if (param("fond") === "opaque") document.body.classList.add("opaque");
const voile = Number(param("voile"));
if (voile > 0 && voile <= 1) document.documentElement.style.setProperty("--voile", voile);
if (vue !== "neutre") $("#ecran").classList.add("voile");
document.title = `Scène ${vue} · ${CFG.nom}`;

const api = await connecter();
let ctx = { eqs: [], ms: [], rots: [], maintenant: () => api.maintenant() }, dernier = "";
api.ecouter("", (v) => {
  const d = v || {};
  surSignalRecharge(d.live?.recharger);
  ctx = { ...ctx, eqs: T.listeEquipes(d), ms: T.listeMatchs(d), rots: T.listeRotations(d) };
  rendre();
});
function rendre() {
  const html = htmlEcran(vue, ctx);
  if (html !== dernier) { $("#ecran").innerHTML = html; dernier = html; }
}
setInterval(rendre, 1000);
</script>
</body>
</html>
